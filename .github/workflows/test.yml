name: Automated Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  # Fast, standalone lint gate. ESLint exits non-zero only on ERRORS, so this
  # gates on error-level problems (0 today) the same way the Lighthouse/HTML jobs
  # gate on deterministic, noise-free checks. The ~1000 existing warnings
  # (mostly security/detect-object-injection) stay informational and do NOT fail
  # the build — matching how score/timing metrics are treated as `warn` elsewhere.
  # No browser, no server, no matrix: needs only Node + the eslint devDependency.
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Run ESLint
        working-directory: ./web
        run: npm run lint

      - name: Validate DI declarations (gated July 2026)
        working-directory: ./web
        run: npm run validate:di

      - name: Validate legacy-read ratchet (loadMiniCycleData may only shrink)
        working-directory: ./web
        run: npm run validate:legacy

      - name: Validate required-dep chaining (a required dep must never be optional-chained)
        working-directory: ./web
        run: npm run validate:chains

      - name: Validate inline scripts (empty-catch intent comments)
        working-directory: ./web
        run: npm run validate:inline

      - name: Validate comment references (named identifiers must exist)
        working-directory: ./web
        run: npm run validate:comments

      - name: Validate ES built-in floor (no post-es2020 built-ins in shipped code)
        working-directory: ./web
        run: npm run validate:builtins

      - name: Validate appContext API surface (get*Api reads must resolve)
        working-directory: ./web
        run: npm run validate:api

      - name: Validate manifest provides (claims must be supplied; no duplicate owners)
        working-directory: ./web
        run: npm run validate:provides

      - name: Validate factory-reset coverage (no storage key may survive a reset)
        working-directory: ./web
        run: npm run validate:reset

      - name: Validate label & history-event registries (keys must resolve)
        working-directory: ./web
        run: npm run validate:labels

      - name: Validate duplicate object keys (a shadowed key resolves, to the wrong value)
        working-directory: ./web
        run: npm run validate:keys

      - name: Validate cache headers (no HTML route may be long-cached)
        working-directory: ./web
        run: npm run validate:cache

      - name: Changelog range (released commits must not be re-listed)
        working-directory: ./web
        run: npm run test:changelog

      # The CSP stage of update-version.sh, extracted so it can be tested at all.
      # Its failures are SILENT — a wrong hash list ships a deploy where a script
      # is blocked in production while every gate stays green (v2.316, v2.424).
      - name: CSP hash sync (the release stage that decides what may execute)
        working-directory: ./web
        run: npm run test:csp-sync

      # The restore.sh stage of update-version.sh, extracted in v2.510 and tested
      # (18 tests) but never run on a PR. Same argument as the CSP stage above:
      # this generates the script a release is rolled back WITH, so a break in it
      # is only discovered at the moment it is needed. Pure Python — no Node, no
      # server, no browser.
      - name: Restore-script generation (the rollback path a bad release depends on)
        working-directory: ./web
        run: npm run test:restore

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: ./web
      run: npm ci

    - name: Install Playwright browsers
      working-directory: ./web
      run: npx playwright install --with-deps chromium

    - name: Start HTTP server in background
      working-directory: ./web
      run: |
        python3 -m http.server 8080 &
        sleep 3
        echo "Server started on port 8080"

    - name: Run automated browser tests
      working-directory: ./web
      run: npm test
      continue-on-error: false # Set to true if you want workflow to pass even with failing tests

    # Layout + service-worker regression guards. Each spawns its OWN server (its
    # own port) and uses the chromium installed above — no extra setup needed.
    # test:layout = centred-panel overlap + measured-var (--header-total-height)
    # publish guard, PLUS a horizontal-overflow sweep of the static pages
    # (product.html across 10 widths — it shipped 296px of sideways scroll at
    # 1280px for months while only the app was being swept). test:sw = offline
    # boot + precache drift (every boot-graph module AND every @imported
    # stylesheet must be precached).
    - name: Run layout regression tests
      working-directory: ./web
      run: npm run test:layout

    - name: Run service-worker offline tests
      working-directory: ./web
      run: npm run test:sw

    # Test-suite meta guards (static, no server): every local test() harness must
    # await async bodies, and every test must assert (or declare no-throw in its
    # name). Stops assertion-free / silently-skipped tests from creeping back in.
    - name: Run test-suite meta guards
      working-directory: ./web
      run: npm run test:meta

    # End-to-end user journey on the REAL app: add tasks → reload (persistence) →
    # complete a cycle (count++ + reset) → offline reload (boot + data intact).
    # Spawns its own server (port 8079) + uses the chromium installed above.
    - name: Run end-to-end journey tests
      working-directory: ./web
      run: npm run test:journey

    # miniCycle Lite (web/lite/tests/): behavior only. The visual baselines are
    # font-dependent (made on macOS) and are run locally before CSS changes.
    # Spawns its own server (port 8074) + uses the chromium installed above.
    - name: Run Lite tests (behavior)
      working-directory: ./web
      run: npm run test:lite -- --no-visual

    # Note: Jest tests are currently experimental/incomplete
    # Main test suite (958 browser tests) runs above

    - name: Test summary
      if: always()
      run: echo "✅ Tests completed for Node.js ${{ matrix.node-version }}"

  # WebKit is the second engine this product ships on (the iOS app is a
  # WKWebView). Non-blocking until it has been green for a few releases, then
  # drop continue-on-error. Firefox can follow the same pattern.
  # Accessibility and contrast in their OWN job, so an unrelated failure earlier
  # in the test matrix (a service-worker precache miss on 2026-10-12, for one)
  # cannot skip them: the a11y result for a build must exist whether or not the
  # rest of that build's run is green.
  test-a11y:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: ./web
      run: npm ci

    - name: Install Playwright browsers
      working-directory: ./web
      run: npx playwright install --with-deps chromium

    # Drives 12 surfaces of the real app and reads the accessibility tree.
    - name: Accessibility semantics (custom controls operable + named)
      working-directory: ./web
      run: npm run test:a11y

    # axe color-contrast per theme and view on solid backgrounds, plus the
    # hand-measured checks (footer over the gradient, phone footer, checkbox
    # edge reported-only). Gated: a new serious violation fails the run.
    - name: Run colour-contrast gate (axe)
      working-directory: ./web
      run: CONTRAST_GATE=1 npm run test:contrast

  test-webkit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: ./web
      run: npm ci

    - name: Install Playwright WebKit
      working-directory: ./web
      run: npx playwright install --with-deps webkit

    - name: Start HTTP server in background
      working-directory: ./web
      run: |
        python3 -m http.server 8080 &
        sleep 3

    - name: Browser tests on WebKit
      working-directory: ./web
      run: npm run test:webkit

    - name: Journeys on WebKit
      working-directory: ./web
      run: npm run test:journey:webkit
