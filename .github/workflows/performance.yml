name: Performance

# Migrated from the inert web/.github/workflows/performance.yml (GitHub only runs
# workflows in the repo-root .github/workflows/).
#
# performance-benchmarks job: INFORMATIONAL — continue-on-error, never gates.
# lighthouse job: PARTIALLY GATING. lighthouserc.json marks only deterministic,
#   non-flaky audits as `error` (viewport, cumulative-layout-shift); every
#   score/timing metric is `warn` and never blocks. Because the only `error`s are
#   noise-free, this step does NOT use continue-on-error — a real layout-shift
#   regression now fails the build instead of hiding in the logs. (Service-worker
#   behaviour is gated far more rigorously by `npm run test:sw`; Lighthouse 12
#   removed its PWA audits, so we don't rely on them here.)
# html-validation job: GATING. Runs the W3C Nu validator over the four maintained
#   HTML pages. Only ERRORS affect the exit code (warnings/info are ignored), and
#   HTML validity is deterministic — the same class of noise-free check as viewport
#   and CLS above, so no continue-on-error.
#   It calls the live validator.w3.org service, so the script separates "could not
#   reach the validator" (exit 2, with an explicit note that it is NOT a validation
#   failure) from "the HTML is invalid" (exit 1) — but both still fail the job. If
#   w3.org flakiness becomes a problem, add continue-on-error here rather than
#   switching engines: the pip `html5validator` package bundles a Nu jar years
#   behind the living standard and false-flags `fetchpriority`, `popover`, `inert`
#   and role-less `<dialog>` (15+ phantom errors on valid modern HTML), and
#   `html-validator-cli` v7 pulls in `request`/`form-data`/`minimist` with 4
#   critical advisories and no forward fix.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Start dev server
        working-directory: ./web
        run: |
          npm start &
          sleep 3

      - name: Run performance benchmarks
        working-directory: ./web
        run: npm run perf
        continue-on-error: true # informational, never a merge gate

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: web/tests/results/
          if-no-files-found: ignore
          retention-days: 30

  html-validation:
    name: HTML Validation (W3C Nu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # No Node, no `npm ci`, no dev server: scripts/validate-html.py is pure
      # stdlib + curl and posts the files straight to validator.w3.org. That
      # keeps this the cheapest job in the workflow (a few seconds).
      # NOT continue-on-error: see the header note.
      - name: Validate HTML
        working-directory: ./web
        run: python3 scripts/validate-html.py

  docs-validation:
    name: Docs Validation (links + nav)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Same shape as html-validation: pure stdlib, no Node, no network.
      # Catches the rot the July 2026 reorg had to clean up by hand — broken
      # relative links, docs unreachable from _sidebar.md, and root CLAUDE.md
      # pointing at moved files (which fails silently and degrades AI-assisted
      # work). Runs in well under a second.
      - name: Validate docs links and navigation
        working-directory: ./web
        run: python3 scripts/validate-docs.py

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: |
          npm ci
          npm install -g @lhci/cli@0.13.x

      - name: Start dev server
        working-directory: ./web
        run: |
          npm start &
          sleep 3

      # NOT continue-on-error: lighthouserc.json gates only deterministic audits
      # (viewport, cumulative-layout-shift) as `error`; all score/timing metrics
      # are `warn`. So a failure here is a real regression, not shared-runner noise.
      - name: Run Lighthouse CI
        working-directory: ./web
        run: lhci autorun

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: web/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 30
