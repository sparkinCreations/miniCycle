name: Tag Releases

# Safety net for release tags. The local release flow (web/scripts/update-version.sh
# --push) creates and pushes the vX.Y tag itself, but releases merged via PR (cloud
# sessions) land the "chore(release): update version to X.Y" commit on main WITHOUT
# a tag — v2.356–v2.365 all shipped untagged this way until backfilled by hand
# (Aug 2026).
#
# On every push to main this scans first-parent history for release commits and
# creates the matching annotated tag ("Release vX.Y", same shape update-version.sh
# produces) for any that are missing. Properties that make this safe:
#   - Idempotent: a tag that already exists is skipped, never moved — so the local
#     flow's own tags are left alone, and an existing tag pointing at the WRONG
#     commit (the known concurrent-push orphan-tag gotcha) is surfaced as a warning
#     for a human to retag deliberately, not silently "fixed".
#   - Self-healing: it scans all of history, not just the pushed range, so any gap
#     (force-push, skipped run, pre-workflow backlog) is closed by the next push.
#   - Non-triggering: tags pushed with GITHUB_TOKEN don't fire other workflows.

on:
  push:
    branches: [ main ]
  workflow_dispatch: # manual backfill without waiting for a push

permissions:
  contents: write # push tags

jobs:
  tag-releases:
    name: Tag untagged release commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create missing release tags
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # FULL history of main, not --first-parent: first-parent sees only
          # merge commits and direct pushes, NOT the commits INSIDE a merged
          # PR branch — which is exactly where cloud-session release commits
          # live. That blind spot silently skipped v2.367–v2.372 while the
          # workflow reported success (found Aug 2026; the original comment
          # claimed first-parent "sees both", which was wrong). --grep keeps
          # the full-history scan cheap. Newest-first order means the current
          # release tags first; an older duplicate of the same version hits
          # the exists-check below and warns instead of retagging.
          git log --format='%H %s' \
              --grep='^chore(release): update version to ' main |
          while read -r sha subject; do
            # Extract X.Y[.Z] right after "to " — some historical subjects carry
            # trailing prose ("…to 2.231 and reflect changes across…"), so a
            # last-word parse is not safe. Empty result = unparseable, skip.
            version=$(printf '%s' "$subject" |
              sed -nE 's/^chore\(release\): update version to ([0-9]+\.[0-9]+(\.[0-9]+)?).*$/\1/p')
            if [ -z "$version" ]; then
              echo "::warning::Skipping unparseable release subject: $subject"
              continue
            fi
            tag="v$version"
            if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
              if [ "$existing" != "$sha" ]; then
                echo "::warning::Tag $tag exists but points at $existing, not release commit $sha — leaving it alone (retag manually if wrong)"
              fi
              continue
            fi
            git tag -a "$tag" -m "Release $tag" "$sha"
            # A tag whose commit predates the LAST change to this workflow file
            # carries an older .github/workflows/ tree, and GitHub refuses to
            # let GITHUB_TOKEN (a GitHub App) create a ref pointing at a
            # "different workflow file" — the push is rejected with a
            # workflows-permission error. That only affects BACKFILL of tags
            # older than the workflow's own last edit; every future release
            # commit is at/after this file, so its tag pushes fine. Warn and
            # continue instead of failing the whole run (which used to abort
            # the backfill on the first old tag and leave a red X), so newer
            # pushable tags still land. Push the historical backlog by hand
            # (a normal user push is not subject to the App restriction).
            if git push origin "$tag" 2>/tmp/tagpush.err; then
              echo "Tagged $tag -> $sha"
            else
              if grep -q "workflow" /tmp/tagpush.err; then
                echo "::warning::Could not push $tag — GITHUB_TOKEN cannot tag a commit whose workflow-file tree differs (backfill of a pre-workflow-edit release). Push it manually: git push origin $tag"
              else
                echo "::warning::Could not push $tag: $(cat /tmp/tagpush.err)"
              fi
              git tag -d "$tag" >/dev/null 2>&1 || true
              continue
            fi
          done
          echo "Done — existing tags untouched; new tags listed above."
