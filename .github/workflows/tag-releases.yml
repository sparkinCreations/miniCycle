name: Tag Releases

# Safety net for release tags. The local release flow (web/scripts/update-version.sh
# --push) creates and pushes the vX.Y tag itself, but releases merged via PR (cloud
# sessions) land the "chore(release): update version to X.Y" commit on main WITHOUT
# a tag — v2.356–v2.365 all shipped untagged this way until backfilled by hand
# (Aug 2026).
#
# On every push to main this scans first-parent history for release commits and
# creates the matching annotated tag ("Release vX.Y", same shape update-version.sh
# produces) for any that are missing. Properties that make this safe:
#   - Idempotent: a tag that already exists is skipped, never moved — so the local
#     flow's own tags are left alone, and an existing tag pointing at the WRONG
#     commit (the known concurrent-push orphan-tag gotcha) is surfaced as a warning
#     for a human to retag deliberately, not silently "fixed".
#   - Self-healing: it scans all of history, not just the pushed range, so any gap
#     (force-push, skipped run, pre-workflow backlog) is closed by the next push.
#   - Non-triggering: tags pushed with GITHUB_TOKEN don't fire other workflows.

on:
  push:
    branches: [ main ]
  workflow_dispatch: # manual backfill without waiting for a push

permissions:
  contents: write # push tags

jobs:
  tag-releases:
    name: Tag untagged release commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create missing release tags
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # First-parent only: a release commit reaches main either directly or via
          # a PR merge; first-parent history of main sees both, and --grep keeps
          # the scan cheap even over full history.
          git log --first-parent --format='%H %s' \
              --grep='^chore(release): update version to ' main |
          while read -r sha subject; do
            # Extract X.Y[.Z] right after "to " — some historical subjects carry
            # trailing prose ("…to 2.231 and reflect changes across…"), so a
            # last-word parse is not safe. Empty result = unparseable, skip.
            version=$(printf '%s' "$subject" |
              sed -nE 's/^chore\(release\): update version to ([0-9]+\.[0-9]+(\.[0-9]+)?).*$/\1/p')
            if [ -z "$version" ]; then
              echo "::warning::Skipping unparseable release subject: $subject"
              continue
            fi
            tag="v$version"
            if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
              if [ "$existing" != "$sha" ]; then
                echo "::warning::Tag $tag exists but points at $existing, not release commit $sha — leaving it alone (retag manually if wrong)"
              fi
              continue
            fi
            git tag -a "$tag" -m "Release $tag" "$sha"
            git push origin "$tag"
            echo "Tagged $tag -> $sha"
          done
          echo "Done — existing tags untouched; new tags listed above."
