# miniCycle Security Headers Configuration for Nginx
# Version: 1.353
# Created: November 13, 2025
#
# Usage: Include this file in your main nginx.conf or site configuration
# Example: include /path/to/miniCycle/nginx-security.conf;

# ===================================================================
# CONTENT SECURITY POLICY (CSP)
# ===================================================================
# NOTE: SHA-256 hashes must be recomputed if ANY inline <script> content changes
# in miniCycle.html OR lite/miniCycle-lite.html
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Ymfy2vFGRmd6kSt4sYyDbiTlfNBCdJXKcHm8PXSOUKY=' 'sha256-vGZuMd1H/FTwm86koTe5wsQY3mvTLKnbF+b8y6E6ELI=' 'sha256-HoVNOC42cKVHDxrnLY25aAvmKNrxd0QbgTdu4G7p9Vk=' 'sha256-ZmCo1D8qlgnCgO2lPu9go7bFumJyHt4sEttY02PYpQ8=' 'sha256-h+r8SXgnpMvpkOBx8UvUXtwr8qr+Jw6l0RYQo66Ga1s=' 'sha256-598+MlUQwZnsi4Bl2TqCLwtrDbSviEHUuCw5e2zjclo=' 'sha256-za1ttq364TAwTTqV10AwAnsXHlgFSXnVpzP82BNmJcM=' 'sha256-PtjTViCuOjuj2D2cao71d7bjI5Rdyc2IJz+Vf3u5IxM=' 'sha256-TJvKNGd2juQ/x1tfGoDak7F4WXI6XRM55SvnV6tddE4=' 'sha256-M2/opFBOapjIMvP41bHLGFCxoB5txNpCe7XKRsuVQwI=' 'sha256-WL5F0h8oroguchAN9gVJMpn8QgFbiHZXo8gnikjEIL0=' 'sha256-4+Try4BCJl5RqrE2z8ON18rf30QjL9aCI3JCAtsTyvQ=' 'sha256-fB/nY9GhU/TNFVUbbqq/8F8sG9a81HMv4dCqev+U4dg=' 'sha256-DCQQFjm4B3/B0HcjExOYHA8gw/94Qrm5ACPOBHZ7CKk=' 'sha256-dUD5gjYa6vypcmpf5dJhZdh6QgSlrC5q3QEIAsZeObs=' 'sha256-ZuPrgD4yQH0+QNbC1TjV9WOT5r1x0PqeigIqippHYEI=' 'sha256-bT3Lba4hfYBGGNwvOzo+kZaPYqsXkcAnNc/pcmd0U/A=' 'sha256-CicEbIPNk0+rCHo6rhXiQN3oT5ds6OCjAW/XaAPmYgQ=' 'sha256-TvxHZOVivrxcPviI9Cd4f1swAF6ZVYzwtIGENftY0+E=' 'sha256-QpkPeUhcvkEgamsLQnX7k8hY+gb4DX1E+xrcb23bhJo=' 'sha256-a94SqZwfzfyu+mNOtpBoB2LkGvjyC4pj9V2CkT3p7ec=' 'sha256-640meEnOenpColBQdyAuD707TeH3jPOOM4rKJiXun9k='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

# ===================================================================
# X-FRAME-OPTIONS
# ===================================================================
add_header X-Frame-Options "DENY" always;

# ===================================================================
# X-CONTENT-TYPE-OPTIONS
# ===================================================================
add_header X-Content-Type-Options "nosniff" always;

# ===================================================================
# X-XSS-PROTECTION
# ===================================================================
add_header X-XSS-Protection "1; mode=block" always;

# ===================================================================
# REFERRER-POLICY
# ===================================================================
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ===================================================================
# PERMISSIONS-POLICY
# ===================================================================
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# ===================================================================
# STRICT-TRANSPORT-SECURITY (HSTS)
# ===================================================================
# Only enable if using HTTPS
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ===================================================================
# HIDE SERVER VERSION
# ===================================================================
server_tokens off;

# ===================================================================
# CACHE CONTROL
# ===================================================================
location ~* \.(html)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
}

location ~* \.(js)$ {
    add_header Cache-Control "public, max-age=3600";
    expires 1h;
}

location ~* \.(css)$ {
    add_header Cache-Control "public, max-age=3600";
    expires 1h;
}

location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
    add_header Cache-Control "public, max-age=2592000";
    expires 30d;
}

location ~* \.(woff|woff2|ttf|otf|eot)$ {
    add_header Cache-Control "public, max-age=31536000";
    expires 1y;
}

location ~* \.(json)$ {
    add_header Cache-Control "no-cache";
    expires 0;
}

# ===================================================================
# PROTECT SENSITIVE FILES
# ===================================================================
location ~ /\. {
    deny all;
}

location ~ \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
    deny all;
}

location ~ (package\.json|package-lock\.json|\.env|\.git.*|\.DS_Store)$ {
    deny all;
}
