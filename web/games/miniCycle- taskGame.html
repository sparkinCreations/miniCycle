<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Whack-a-Task</title>
  <style>
    /* Basic styling for the game */
    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .game-container {
      background: white;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    #displayTask {
      font-size: 1.5rem;
      margin: 20px 0;
      padding: 10px;
      background: #e6e6e6;
      border-radius: 4px;
    }
    .options-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .option-btn {
      padding: 10px 15px;
      font-size: 1rem;
      border: none;
      background: #4c79ff;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      min-width: 100px;
    }
    .option-btn:hover {
      background: #3a65d9;
    }
    .feedback {
      font-size: 1.2rem;
      margin-bottom: 10px;
      font-weight: bold;
    }
    #score {
      font-size: 1rem;
      margin-bottom: 20px;
    }
    #nextRound {
      padding: 8px 16px;
      font-size: 1rem;
      border: none;
      background: #28a745;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    #nextRound:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Task Whack-a-Task</h1>
    <p id="instruction">Click the option that matches the target task below:</p>
    <div id="displayTask">Loading...</div>
    <div class="options-container" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div id="score">Score: 0</div>
    <button id="nextRound">Next Round</button>
  </div>

  <script src="miniCycle-taskGame.js"></script>
</body>
</html>
