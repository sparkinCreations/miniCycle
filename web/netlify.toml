# Netlify configuration file
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build pipeline (BUILD_PIPELINE_PLAN.md): bundle+minify into dist/, publish that.
  # Dev stays no-build — this only runs on Netlify deploys.
  publish = "dist"
  command = "npm install && node scripts/build-web.cjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

# Domain redirects for minicycleapp.com
[[redirects]]
  from = "https://minicycleapp.com/*"
  to = "https://minicycle.app/product.html"
  status = 301
  force = true

[[redirects]]
  from = "https://www.minicycleapp.com/*"
  to = "https://minicycle.app/product.html"
  status = 301
  force = true

# Alternative www redirect (in case the above doesn't work)
[[redirects]]
  from = "http://www.minicycleapp.com/*"
  to = "https://minicycle.app/product.html"
  status = 301
  force = true

# ═══════════════════════════════════════════════════════════════════════════
# DOCS SUBDOMAIN (docs.minicycle.app) — same Netlify site, own ORIGIN.
#
# WHY (Jul 2026): the docs ran only under minicycle.app/docs, and Docsify's
# search plugin stores a multi-MB full-text index in localStorage — on the
# APP's origin, where it competed with user routines for the same ~5MB quota.
# The storage meter honestly reported it, and under pressure the quota gate
# can block routine imports. A separate origin gives the docs their own
# quota — the same isolation pattern as test.minicycle.app.
#
# ONE-TIME SETUP (Netlify UI + DNS, cannot be done from this file):
#   1. Netlify site → Domain management → add alias "docs.minicycle.app"
#   2. DNS: CNAME docs → this site's *.netlify.app hostname
# THE ACTUAL RULES LIVE IN `_redirects` (v2.344 lesson): Netlify processes
# the _redirects file with precedence, and this deploy-file netlify.toml's
# [[redirects]] section turned out not to be consulted at all (its [[headers]]
# ARE — verified via live CSP). The docs rules were moved to _redirects,
# placed ABOVE the root/catch-all rules and forced (200!/301!) so they beat
# static-file shadowing and the host-agnostic fallbacks.

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    # NOTE: X-Frame-Options intentionally NOT set. It can only express SAMEORIGIN/DENY,
    # which cannot allow the app to frame the separate test-runner origin
    # (test.minicycle.app). Clickjacking protection is enforced via CSP frame-ancestors
    # below, which modern browsers honor and which CAN name a specific allowed origin.
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # HSTS - enforce HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy - SHA-256 hashes for inline scripts (no 'unsafe-inline' needed)
    # NOTE: Hashes must be recomputed if ANY inline <script> content changes
    # in miniCycle.html, lite/miniCycle-lite.html, OR tests/module-test-suite.html
    # - cdnjs.cloudflare.com for Font Awesome (lite version)
    # - Web3Forms and Formspree for feedback form submissions
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-598+MlUQwZnsi4Bl2TqCLwtrDbSviEHUuCw5e2zjclo=' 'sha256-za1ttq364TAwTTqV10AwAnsXHlgFSXnVpzP82BNmJcM=' 'sha256-PtjTViCuOjuj2D2cao71d7bjI5Rdyc2IJz+Vf3u5IxM=' 'sha256-TJvKNGd2juQ/x1tfGoDak7F4WXI6XRM55SvnV6tddE4=' 'sha256-JIJELDjHhXx6g0I8ah11XDU9I8XbKUXb1vR0mol7gT4=' 'sha256-WL5F0h8oroguchAN9gVJMpn8QgFbiHZXo8gnikjEIL0=' 'sha256-4+Try4BCJl5RqrE2z8ON18rf30QjL9aCI3JCAtsTyvQ=' 'sha256-7goox27RNRNw5f/3QIuzxLPa9lHoCHca7NycwLYjTrs=' 'sha256-DCQQFjm4B3/B0HcjExOYHA8gw/94Qrm5ACPOBHZ7CKk=' 'sha256-dUD5gjYa6vypcmpf5dJhZdh6QgSlrC5q3QEIAsZeObs=' 'sha256-bsQnxWPJvOL8lrDJj0Td7Wi6H1klK2MgA3/lMOxjmEQ=' 'sha256-bT3Lba4hfYBGGNwvOzo+kZaPYqsXkcAnNc/pcmd0U/A=' 'sha256-CicEbIPNk0+rCHo6rhXiQN3oT5ds6OCjAW/XaAPmYgQ=' 'sha256-TvxHZOVivrxcPviI9Cd4f1swAF6ZVYzwtIGENftY0+E=' 'sha256-vGZuMd1H/FTwm86koTe5wsQY3mvTLKnbF+b8y6E6ELI=' 'sha256-HoVNOC42cKVHDxrnLY25aAvmKNrxd0QbgTdu4G7p9Vk=' 'sha256-ZmCo1D8qlgnCgO2lPu9go7bFumJyHt4sEttY02PYpQ8=' 'sha256-h+r8SXgnpMvpkOBx8UvUXtwr8qr+Jw6l0RYQo66Ga1s=' 'sha256-QpkPeUhcvkEgamsLQnX7k8hY+gb4DX1E+xrcb23bhJo=' 'sha256-HaKnA/ZCP/dDQojXmhbJoVxcMGqmCWdkhV+VaLsXTxQ='; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.web3forms.com https://formspree.io https://cdnjs.cloudflare.com https://*.netlify.app; form-action 'self' https://api.web3forms.com https://formspree.io; manifest-src 'self'; worker-src 'self'; base-uri 'self'; frame-ancestors 'self'; frame-src 'self' https://test.minicycle.app; child-src 'self' https://test.minicycle.app"

    # Permissions Policy - restrict sensitive APIs
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

    # PWA and caching headers
    Cache-Control = "public, max-age=31536000"
    
# ═══════════════════════════════════════════════════════════════════════════
# SAFARI FIX: Use "no-store" instead of "must-revalidate"
# Safari's memory cache sits ABOVE service workers and ignores must-revalidate.
# Only "no-store" reliably prevents Safari from serving stale cached content.
# See: https://github.com/w3c/ServiceWorker/issues/1510
# ═══════════════════════════════════════════════════════════════════════════

[[headers]]
  for = "*.html"
  [headers.values]
    # CRITICAL: no-store prevents Safari memory cache from serving stale HTML
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Root document. `_redirects` serves it via a 200 REWRITE ("/  /miniCycle.html  200"),
# so Netlify matches headers on the REQUEST path "/", which the "*.html" rule above
# cannot match (no extension). Without this, "/" falls through to the "/*" catch-all
# and the entry HTML is cached for a YEAR — serving stale markup that references old
# /build/ hashes after a deploy. Same pretty-URL/no-extension fix already applied to
# "/pages/*" below. Last-match-wins, and this is after "/*", so it overrides it.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/pages/*"
  [headers.values]
    # Pages served via pretty URLs (no .html extension) need explicit no-cache
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    # Cache manifest for PWA (less critical, can be cached briefly)
    Cache-Control = "public, max-age=3600"

# Markdown files (CHANGELOG, etc.) — short cache + revalidation so updates
# appear within minutes. Without this, the catch-all "/*" rule above caches
# CHANGELOG.md for a year, leaving the product page changelog stuck on
# whatever entries existed when a visitor first loaded the file.
[[headers]]
  for = "*.md"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# CSS files - cache for 1 day for offline support
# Version param (?v=X.XXX) in HTML link tags handles cache busting
# Without browser caching, offline boot fails when iOS kills the service worker
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# JavaScript files - cache for 1 day for offline support
# Version param (?v=X.XXX) in dynamic imports handles cache busting
# CRITICAL: iOS kills the PWA's service worker after the app is backgrounded.
# When the user reopens offline, the SW may not restart. Without browser-level
# caching, all module imports fail because no-cache requires server revalidation
# (impossible when offline). max-age=86400 lets the browser serve cached files
# for 24 hours without revalidation — plenty for offline sessions.
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/modules/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/modules/**/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Hashed build output (entries + chunks + CSS bundle, entry-hashing phase) —
# content-addressed filenames, safe to cache forever. This is what makes the
# SW-precache double-fetch free: precache requests hit the browser HTTP cache,
# and unchanged files cost nothing across deploys.
[[headers]]
  for = "/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CRITICAL FILES - Must come AFTER general *.js rule (last match wins in Netlify)
# These use no-store for Safari compatibility - Safari ignores must-revalidate
[[headers]]
  for = "/version.js"
  [headers.values]
    # version.js must NEVER be cached - it's the source of truth for version checks
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    # Service worker file should never be cached by browser
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/pages/*.js"
  [headers.values]
    # Marketing/admin page scripts (dashboard.js, product.js, learn_more.js) are
    # not part of the offline PWA — they require network anyway. Without this
    # override, the general *.js rule caches them for 24h and forces hard reloads.
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# ═══════════════════════════════════════════════════════════════════════════
# TEST RUNNER (/tests/*) — served on the SEPARATE origin (test.minicycle.app),
# embedded by the app as a cross-origin iframe. Two overrides vs the global CSP:
#   1. frame-ancestors allows the app origin to frame the runner.
#   2. script-src 'unsafe-inline' so the runner's large inline <script type=module>
#      runs WITHOUT a maintained SHA-256 hash. Safe: this origin holds no user data
#      (its localStorage/IndexedDB is physically isolated from minicycle.app).
# Last-match-wins, so this overrides the global "/*" CSP for /tests/* paths.
# ═══════════════════════════════════════════════════════════════════════════
[[headers]]
  for = "/tests/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; frame-ancestors 'self' https://minicycle.app"