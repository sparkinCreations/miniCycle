# Netlify configuration file
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Publish directory (where your built site files are located)
  publish = "."
  
  # Command to run before deploying (if you have a build process)
  # command = "npm run build"

# Domain redirects for minicycleapp.com
[[redirects]]
  from = "https://minicycleapp.com/*"
  to = "https://minicycle.app/product.html"
  status = 301
  force = true

[[redirects]]
  from = "https://www.minicycleapp.com/*"
  to = "https://minicycle.app/product.html"
  status = 301
  force = true

# Alternative www redirect (in case the above doesn't work)
[[redirects]]
  from = "http://www.minicycleapp.com/*"
  to = "https://minicycle.app/product.html"
  status = 301
  force = true

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # HSTS - enforce HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy - permissive for vanilla JS architecture
    # - 'unsafe-inline' required for inline scripts (no build step)
    # - Google Fonts for external fonts
    # - Cloudflare CDN for Font Awesome
    # - Web3Forms for feedback form submissions
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://api.web3forms.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; form-action 'self' https://api.web3forms.com; manifest-src 'self'; worker-src 'self'; base-uri 'self'"

    # Permissions Policy - restrict sensitive APIs
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

    # PWA and caching headers
    Cache-Control = "public, max-age=31536000"
    
[[headers]]
  for = "*.html"
  [headers.values]
    # Don't cache HTML files as aggressively
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    # Cache manifest for PWA
    Cache-Control = "public, max-age=86400"

# Version control plane - must revalidate to prevent stale version loops
[[headers]]
  for = "/version.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JavaScript modules - must revalidate to ensure version param works
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/modules/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/modules/**/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"