# Netlify configuration file
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Publish directory (where your built site files are located)
  publish = "."
  
  # Command to run before deploying (if you have a build process)
  # command = "npm run build"

# Domain redirects for minicycleapp.com
[[redirects]]
  from = "https://minicycleapp.com/*"
  to = "https://minicycle.app/product.html"
  status = 301
  force = true

[[redirects]]
  from = "https://www.minicycleapp.com/*"
  to = "https://minicycle.app/product.html"
  status = 301
  force = true

# Alternative www redirect (in case the above doesn't work)
[[redirects]]
  from = "http://www.minicycleapp.com/*"
  to = "https://minicycle.app/product.html"
  status = 301
  force = true

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # HSTS - enforce HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy - SHA-256 hashes for inline scripts (no 'unsafe-inline' needed)
    # NOTE: Hashes must be recomputed if ANY inline <script> content changes
    # in miniCycle.html OR lite/miniCycle-lite.html
    # - cdnjs.cloudflare.com for Font Awesome (lite version)
    # - Web3Forms and Formspree for feedback form submissions
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-3Xbv1x8IO7a2BA/oYED4OTrf+44CPz5dLfxVpEswDOg=' 'sha256-PtjTViCuOjuj2D2cao71d7bjI5Rdyc2IJz+Vf3u5IxM=' 'sha256-is3p4zpxwXm44dMheYjF5v+H/4wW+gUYr74vcqyiV3w=' 'sha256-9oUJeQk/LnW7VxfSmRqGw4lXWmtMuImBkFhmgZ7Ba24=' 'sha256-sJx991XPbUZFhuZvc9oIsNgT1VqZwTg2i8CnRbhRRQE=' 'sha256-Ap/qUcImyjbtMrnIDm33iL8CxsWsZv59fJqy6NvxgeA=' 'sha256-dH6NPiVfMuKFmbIyk5/8uKmbYNjl/15FQdplPtcbkJU=' 'sha256-tH9zTPwQPfjoVZK5ZX8hiQPwALCJqJsGg6KQWh266TQ=' 'sha256-yq5YWawkldG3IbK41kf3idyXTblu9dsCRvWaCjZRsd8=' 'sha256-H5cwKCzq4XtgjtloC40EDA5K9ciXt2ttmi8onTVlyGs=' 'sha256-vGZuMd1H/FTwm86koTe5wsQY3mvTLKnbF+b8y6E6ELI=' 'sha256-tKyRJ404AShXo9zS9XO4RAMZC+FYaLiXuGaAs5IfXgI=' 'sha256-ZmCo1D8qlgnCgO2lPu9go7bFumJyHt4sEttY02PYpQ8=' 'sha256-h+r8SXgnpMvpkOBx8UvUXtwr8qr+Jw6l0RYQo66Ga1s='; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://api.web3forms.com https://formspree.io https://cdnjs.cloudflare.com; form-action 'self' https://api.web3forms.com https://formspree.io; manifest-src 'self'; worker-src 'self'; base-uri 'self'"

    # Permissions Policy - restrict sensitive APIs
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

    # PWA and caching headers
    Cache-Control = "public, max-age=31536000"
    
# ═══════════════════════════════════════════════════════════════════════════
# SAFARI FIX: Use "no-store" instead of "must-revalidate"
# Safari's memory cache sits ABOVE service workers and ignores must-revalidate.
# Only "no-store" reliably prevents Safari from serving stale cached content.
# See: https://github.com/w3c/ServiceWorker/issues/1510
# ═══════════════════════════════════════════════════════════════════════════

[[headers]]
  for = "*.html"
  [headers.values]
    # CRITICAL: no-store prevents Safari memory cache from serving stale HTML
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    # Cache manifest for PWA (less critical, can be cached briefly)
    Cache-Control = "public, max-age=3600"

# JavaScript modules - use no-cache (revalidate) but allow service worker caching
# no-store is too aggressive and breaks offline support
# The version parameter (?v=X.XXX) handles cache busting for modules
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"

[[headers]]
  for = "/modules/*.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"

[[headers]]
  for = "/modules/**/*.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"

# CRITICAL FILES - Must come AFTER general *.js rule (last match wins in Netlify)
# These use no-store for Safari compatibility - Safari ignores must-revalidate
[[headers]]
  for = "/version.js"
  [headers.values]
    # version.js must NEVER be cached - it's the source of truth for version checks
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    # Service worker file should never be cached by browser
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"