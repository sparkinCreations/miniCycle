<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!--
    Fitness Background Pattern
    Icons: dumbbell, lightning bolt, bullseye, ECG heartbeat,
           stopwatch, medal with star, trophy, running shoe
  -->
  <g fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Dumbbell / strength (top-left, angled) -->
    <g transform="rotate(25 24 20)">
      <!-- Bar -->
      <line x1="6" y1="20" x2="42" y2="20" stroke-width="1.6"/>
      <!-- Outer weight plates -->
      <rect x="2" y="13" width="8" height="14" rx="2" stroke-width="1.4"/>
      <rect x="38" y="13" width="8" height="14" rx="2" stroke-width="1.4"/>
      <!-- Inner collar rings -->
      <rect x="9" y="16" width="4" height="8" rx="1" stroke-width="1"/>
      <rect x="35" y="16" width="4" height="8" rx="1" stroke-width="1"/>
      <!-- Grip knurling -->
      <line x1="17" y1="18" x2="17" y2="22" stroke-width="0.7"/>
      <line x1="21" y1="18" x2="21" y2="22" stroke-width="0.7"/>
      <line x1="25" y1="18" x2="25" y2="22" stroke-width="0.7"/>
      <line x1="29" y1="18" x2="29" y2="22" stroke-width="0.7"/>
    </g>

    <!-- Lightning bolt / energy (top-right) -->
    <g transform="rotate(3 165 23)">
      <path d="M172 7 L160 25 L168 25 L156 41 L170 22 L162 22 Z" stroke-width="1.5"/>
      <!-- Inner highlight edge -->
      <path d="M170 10 L163 22 L168 22" stroke-width="0.7"/>
    </g>

    <!-- Bullseye / goal (top-center) -->
    <g transform="rotate(0 100 22)">
      <circle cx="100" cy="22" r="14" stroke-width="1.3"/>
      <circle cx="100" cy="22" r="9" stroke-width="1.1"/>
      <circle cx="100" cy="22" r="4" stroke-width="1.4"/>
      <!-- Crosshair ticks -->
      <line x1="100" y1="6" x2="100" y2="8" stroke-width="0.8"/>
      <line x1="100" y1="36" x2="100" y2="38" stroke-width="0.8"/>
      <line x1="84" y1="22" x2="86" y2="22" stroke-width="0.8"/>
      <line x1="114" y1="22" x2="116" y2="22" stroke-width="0.8"/>
    </g>

    <!-- ECG heartbeat / cardio (left) -->
    <g transform="rotate(-3 18 92)">
      <!-- Waveform: P wave, QRS complex, T wave -->
      <path d="M3 92 L9 92 L11 88 L13 92 L15 84 L18 101 L21 88 L23 92 L26 92 L30 92" stroke-width="1.4"/>
      <!-- Subtle grid lines -->
      <line x1="3" y1="88" x2="30" y2="88" stroke-width="0.4"/>
      <line x1="3" y1="96" x2="30" y2="96" stroke-width="0.4"/>
      <line x1="16" y1="83" x2="16" y2="101" stroke-width="0.4"/>
    </g>

    <!-- Stopwatch / timing (right) -->
    <g transform="rotate(5 179 90)">
      <!-- Face -->
      <circle cx="179" cy="91" r="13" stroke-width="1.4"/>
      <!-- Inner ring -->
      <circle cx="179" cy="91" r="9" stroke-width="0.6"/>
      <!-- Crown button -->
      <path d="M175 78 L183 78" stroke-width="1.5"/>
      <rect x="178" y="75" width="2" height="4" rx="1" stroke-width="1"/>
      <!-- Side button -->
      <line x1="184" y1="77" x2="187" y2="74" stroke-width="1"/>
      <!-- Tick marks (12/3/6/9) -->
      <line x1="179" y1="79" x2="179" y2="81" stroke-width="0.9"/>
      <line x1="179" y1="101" x2="179" y2="103" stroke-width="0.9"/>
      <line x1="167" y1="91" x2="169" y2="91" stroke-width="0.9"/>
      <line x1="189" y1="91" x2="191" y2="91" stroke-width="0.9"/>
      <!-- Hands -->
      <line x1="179" y1="82" x2="179" y2="91" stroke-width="1.6"/>
      <line x1="179" y1="91" x2="188" y2="87" stroke-width="1.3"/>
      <!-- Center -->
      <circle cx="179" cy="91" r="1.5" stroke-width="0.9"/>
    </g>

    <!-- Medal / achievement (center) -->
    <g transform="rotate(-5 96 118)">
      <!-- Ribbon straps -->
      <path d="M90 116 L86 100 L91 103 L96 100 L101 103 L106 100 L102 116" stroke-width="1.2"/>
      <line x1="90" y1="116" x2="102" y2="116" stroke-width="1.1"/>
      <!-- Ribbon fold lines -->
      <path d="M89 108 L91 106 M103 108 L101 106" stroke-width="0.7"/>
      <!-- Medal face -->
      <circle cx="96" cy="127" r="12" stroke-width="1.4"/>
      <circle cx="96" cy="127" r="9" stroke-width="0.7"/>
      <!-- Star engraving -->
      <path d="M96 120 L97.3 123.9 L101.4 123.9 L98.1 126.2 L99.4 130.2 L96 127.8 L92.6 130.2 L93.9 126.2 L90.6 123.9 L94.7 123.9 Z" stroke-width="0.9"/>
    </g>

    <!-- Trophy / victory (bottom-left) -->
    <g transform="rotate(-6 29 163)">
      <!-- Base plate -->
      <rect x="21" y="173" width="18" height="5" rx="1" stroke-width="1.3"/>
      <!-- Stem -->
      <rect x="27" y="169" width="6" height="5" rx="1" stroke-width="1.1"/>
      <!-- Cup body -->
      <path d="M19 155 L19 169 L39 169 L39 155" stroke-width="1.4"/>
      <!-- Cup rim -->
      <line x1="22" y1="155" x2="36" y2="155" stroke-width="1.5"/>
      <!-- Handles -->
      <path d="M19 160 C14 160 12 164 15 167 L19 167" stroke-width="1.2"/>
      <path d="M39 160 C44 160 46 164 43 167 L39 167" stroke-width="1.2"/>
      <!-- Star inside cup -->
      <path d="M29 159 L30.2 162.6 L34 162.6 L31 164.8 L32.2 168.4 L29 166.2 L25.8 168.4 L27 164.8 L24 162.6 L27.8 162.6 Z" stroke-width="0.9"/>
    </g>

    <!-- Running shoe / run (bottom-right) -->
    <g transform="rotate(5 163 165)">
      <!-- Sole outline -->
      <path d="M149 173 C149 168 153 163 159 161 C165 159 173 162 176 167 C178 170 177 175 173 176 C168 177 155 177 151 178" stroke-width="1.4"/>
      <!-- Upper body -->
      <path d="M159 161 L157 155 L163 154 L169 161" stroke-width="1.2"/>
      <!-- Ankle collar -->
      <path d="M157 155 Q162 152 169 155" stroke-width="0.9"/>
      <!-- Lace detail -->
      <path d="M159 158 L163 157" stroke-width="0.8"/>
      <path d="M161 160 L165 159" stroke-width="0.8"/>
      <!-- Toe bumper -->
      <path d="M176 167 C178 164 181 163 183 164" stroke-width="1"/>
      <!-- Sole tread lines -->
      <line x1="153" y1="175" x2="153" y2="178" stroke-width="0.7"/>
      <line x1="158" y1="176" x2="158" y2="178" stroke-width="0.7"/>
      <line x1="163" y1="176" x2="163" y2="178" stroke-width="0.7"/>
      <line x1="168" y1="176" x2="168" y2="178" stroke-width="0.7"/>
    </g>

  </g>
</svg>
