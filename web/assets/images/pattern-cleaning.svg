<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!--
    Cleaning Background Pattern
    Icons: broom, spray bottle, 4-point sparkle, soap bubbles,
           mop, swirl/polish, bucket, diamond sparkle
  -->
  <g fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Broom / sweep (top-left, angled) -->
    <g transform="rotate(-25 22 24)">
      <!-- Handle -->
      <line x1="22" y1="3" x2="22" y2="32" stroke-width="1.5"/>
      <!-- Handle grip wrap -->
      <line x1="19" y1="12" x2="25" y2="12" stroke-width="0.8"/>
      <line x1="19" y1="15" x2="25" y2="15" stroke-width="0.8"/>
      <line x1="19" y1="18" x2="25" y2="18" stroke-width="0.8"/>
      <!-- Broom head body (trapezoidal) -->
      <path d="M13 32 L11 43 L33 43 L31 32 Z" stroke-width="1.4"/>
      <!-- Bristle strands -->
      <line x1="13" y1="43" x2="11" y2="49" stroke-width="1.1"/>
      <line x1="16" y1="43" x2="14" y2="49" stroke-width="1"/>
      <line x1="19" y1="43" x2="18" y2="49" stroke-width="1"/>
      <line x1="22" y1="43" x2="22" y2="49" stroke-width="1"/>
      <line x1="25" y1="43" x2="26" y2="49" stroke-width="1"/>
      <line x1="28" y1="43" x2="30" y2="49" stroke-width="1"/>
      <line x1="31" y1="43" x2="33" y2="49" stroke-width="1.1"/>
      <!-- Binding band -->
      <line x1="12" y1="38" x2="32" y2="38" stroke-width="1.2"/>
    </g>

    <!-- Spray bottle (top-right) -->
    <g transform="rotate(5 168 22)">
      <!-- Bottle body -->
      <rect x="161" y="13" width="12" height="20" rx="2.5" stroke-width="1.4"/>
      <!-- Spray head / trigger housing -->
      <path d="M161 21 L156 17 L153 17 L153 23 L161 23" stroke-width="1.2"/>
      <!-- Trigger -->
      <path d="M155 21 L153 24 L156 25" stroke-width="1"/>
      <!-- Nozzle tip -->
      <line x1="153" y1="17" x2="150" y2="15" stroke-width="1"/>
      <!-- Cap / pump top -->
      <line x1="167" y1="13" x2="167" y2="10" stroke-width="1.3"/>
      <line x1="164" y1="10" x2="170" y2="10" stroke-width="1.2"/>
      <!-- Label line detail on body -->
      <line x1="163" y1="20" x2="171" y2="20" stroke-width="0.8"/>
      <line x1="163" y1="24" x2="171" y2="24" stroke-width="0.8"/>
      <!-- Mist spray droplets -->
      <circle cx="146" cy="14" r="1" stroke-width="0.7"/>
      <circle cx="144" cy="17" r="0.8" stroke-width="0.7"/>
      <circle cx="147" cy="19" r="0.7" stroke-width="0.7"/>
      <circle cx="143" cy="21" r="1" stroke-width="0.7"/>
      <circle cx="146" cy="23" r="0.8" stroke-width="0.7"/>
    </g>

    <!-- 4-point sparkle / shine (top-center) -->
    <g transform="rotate(12 100 20)">
      <!-- Main 4-point star -->
      <path d="M100 8 L101.8 18.2 L112 20 L101.8 21.8 L100 32 L98.2 21.8 L88 20 L98.2 18.2 Z" stroke-width="1.3"/>
      <!-- Corner accent dots -->
      <circle cx="93" cy="13" r="1" stroke-width="0.7"/>
      <circle cx="107" cy="13" r="1" stroke-width="0.7"/>
      <circle cx="93" cy="27" r="1" stroke-width="0.7"/>
      <circle cx="107" cy="27" r="1" stroke-width="0.7"/>
      <!-- Inner small star -->
      <path d="M100 16 L100.8 19.2 L104 20 L100.8 20.8 L100 24 L99.2 20.8 L96 20 L99.2 19.2 Z" stroke-width="0.6"/>
    </g>

    <!-- Soap bubbles / suds (left) -->
    <g transform="rotate(-5 16 93)">
      <!-- Main cluster of bubbles with varied sizes -->
      <circle cx="14" cy="85" r="8" stroke-width="1.4"/>
      <circle cx="26" cy="93" r="6" stroke-width="1.3"/>
      <circle cx="10" cy="100" r="5" stroke-width="1.2"/>
      <circle cx="23" cy="104" r="7" stroke-width="1.3"/>
      <circle cx="32" cy="85" r="4" stroke-width="1"/>
      <!-- Shine highlights on main bubbles -->
      <path d="M10 82 Q12 80 14 82" stroke-width="0.6"/>
      <path d="M23 90 Q25 88 27 90" stroke-width="0.6"/>
      <path d="M19 101 Q21 99 23 101" stroke-width="0.6"/>
      <!-- Small surface bubbles -->
      <circle cx="20" cy="88" r="2" stroke-width="0.7"/>
      <circle cx="28" cy="98" r="2.5" stroke-width="0.7"/>
      <circle cx="15" cy="107" r="2" stroke-width="0.7"/>
    </g>

    <!-- Mop / wet mop (right) -->
    <g transform="rotate(-8 179 90)">
      <!-- Handle pole -->
      <line x1="179" y1="74" x2="179" y2="98" stroke-width="1.5"/>
      <!-- Handle grip rings -->
      <line x1="176" y1="80" x2="182" y2="80" stroke-width="0.8"/>
      <line x1="176" y1="83" x2="182" y2="83" stroke-width="0.8"/>
      <!-- Mop head base connector -->
      <path d="M171 98 C171 95 175 95 179 95 C183 95 187 95 187 98" stroke-width="1.3"/>
      <!-- Wet mop strands (curved droop) -->
      <path d="M171 98 Q169 106 168 112" stroke-width="1.1"/>
      <path d="M173 99 Q172 107 171 112" stroke-width="1"/>
      <path d="M176 100 Q175 108 175 112" stroke-width="1"/>
      <path d="M179 100 Q179 108 179 113" stroke-width="1"/>
      <path d="M182 100 Q183 108 183 112" stroke-width="1"/>
      <path d="M185 99 Q186 107 187 112" stroke-width="1"/>
      <path d="M187 98 Q189 106 190 112" stroke-width="1.1"/>
    </g>

    <!-- Swirl / polish spiral (center) -->
    <g transform="rotate(-10 96 118)">
      <!-- Spiral — outer to inner, 2.5 turns -->
      <path d="M96 106 C84 106 76 114 76 122 C76 133 86 141 97 139 C111 137 120 125 118 113 C116 101 104 93 93 98 C85 101 80 110 84 118 C87 124 95 127 102 122 C107 117 107 110 102 107" stroke-width="1.4"/>
      <!-- Polish shine dots at center -->
      <circle cx="99" cy="117" r="1.5" stroke-width="0.8"/>
      <circle cx="95" cy="121" r="1" stroke-width="0.7"/>
    </g>

    <!-- Bucket (bottom-left) -->
    <g transform="rotate(-5 29 162)">
      <!-- Bucket body (trapezoidal) -->
      <path d="M17 152 L21 178 L37 178 L41 152 Z" stroke-width="1.4"/>
      <!-- Top rim ellipse -->
      <ellipse cx="29" cy="152" rx="12" ry="4" stroke-width="1.3"/>
      <!-- Handle arc -->
      <path d="M20 152 C20 145 38 145 38 152" stroke-width="1.2"/>
      <!-- Handle attachment hooks -->
      <line x1="20" y1="152" x2="20" y2="149" stroke-width="1"/>
      <line x1="38" y1="152" x2="38" y2="149" stroke-width="1"/>
      <!-- Water surface ripple line inside -->
      <path d="M22 162 Q29 160 36 162" stroke-width="0.8"/>
      <!-- Water fill level line -->
      <path d="M21 168 Q29 166 37 168" stroke-width="0.7"/>
      <!-- Bucket label stripe -->
      <line x1="18" y1="158" x2="40" y2="158" stroke-width="0.9"/>
    </g>

    <!-- Diamond sparkle / gleam (bottom-right) -->
    <g transform="rotate(8 162 163)">
      <!-- Long vertical ray -->
      <line x1="162" y1="150" x2="162" y2="176" stroke-width="1.4"/>
      <!-- Long horizontal ray -->
      <line x1="149" y1="163" x2="175" y2="163" stroke-width="1.4"/>
      <!-- Diagonal rays (shorter) -->
      <line x1="154" y1="155" x2="170" y2="171" stroke-width="0.9"/>
      <line x1="170" y1="155" x2="154" y2="171" stroke-width="0.9"/>
      <!-- Tiny corner sparkle dots -->
      <circle cx="162" cy="148" r="1" stroke-width="0.7"/>
      <circle cx="162" cy="178" r="1" stroke-width="0.7"/>
      <circle cx="147" cy="163" r="1" stroke-width="0.7"/>
      <circle cx="177" cy="163" r="1" stroke-width="0.7"/>
      <!-- Inner small diamond cross -->
      <line x1="162" y1="157" x2="162" y2="169" stroke-width="0.7"/>
      <line x1="156" y1="163" x2="168" y2="163" stroke-width="0.7"/>
    </g>

  </g>
</svg>
