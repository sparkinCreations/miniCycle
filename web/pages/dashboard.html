<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>miniCycle Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../assets/images/logo/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f1923;
            color: #e0e6ed;
            min-height: 100vh;
        }

        /* Auth Screen */
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .auth-card {
            background: #1a2733;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 0.5rem;
            color: #fff;
            font-size: 1.4rem;
        }

        .auth-card p {
            color: #7a8b9a;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .auth-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #2a3a4a;
            border-radius: 8px;
            background: #0f1923;
            color: #e0e6ed;
            font-size: 1rem;
            margin-bottom: 1rem;
            font-family: inherit;
        }

        .auth-input:focus {
            outline: none;
            border-color: #0088ff;
        }

        .auth-btn {
            width: 100%;
            padding: 0.8rem;
            background: #0088ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background: #0077e6;
        }

        .auth-error {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            display: none;
        }

        .auth-remember {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #a0aec0;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .auth-remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #0088ff;
            cursor: pointer;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            max-width: 1240px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .dashboard-header h1 {
            font-size: 1.6rem;
            color: #fff;
        }

        .dashboard-header h1 span {
            color: #0088ff;
        }

        .header-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .refresh-btn {
            padding: 0.5rem 1rem;
            background: #1a2733;
            color: #7a8b9a;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #2a3a4a;
            color: #e0e6ed;
        }

        .last-updated {
            color: #4a5a6a;
            font-size: 0.8rem;
        }

        /* Range tabs */
        .range-tabs {
            display: inline-flex;
            background: #1a2733;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            padding: 2px;
            gap: 2px;
        }

        .range-tab {
            padding: 0.4rem 0.75rem;
            background: transparent;
            color: #7a8b9a;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s, color 0.15s;
        }

        .range-tab:hover {
            color: #e0e6ed;
        }

        .range-tab.active {
            background: #0088ff;
            color: #fff;
        }

        /* Error banner */
        .error-banner {
            background: rgba(255, 107, 107, 0.12);
            border: 1px solid rgba(255, 107, 107, 0.35);
            color: #ff9b9b;
            border-radius: 8px;
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
        }

        .error-banner[hidden] { display: none; }

        /* Summary Cards */
        .summary-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .summary-card {
            background: #1a2733;
            border-radius: 10px;
            padding: 1.25rem 1rem;
            text-align: center;
        }

        .summary-card .label {
            font-size: 0.75rem;
            color: #7a8b9a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .summary-card .label-range {
            color: #4a5a6a;
            font-weight: 600;
        }

        .summary-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.1;
        }

        .summary-card .value.blue { color: #0088ff; }
        .summary-card .value.green { color: #00c48c; }

        .summary-card .delta {
            font-size: 0.75rem;
            margin-top: 0.4rem;
            color: #7a8b9a;
            font-weight: 500;
            min-height: 1em;
        }
        .summary-card .delta.up { color: #00c48c; }
        .summary-card .delta.down { color: #ff6b6b; }

        /* Panel grid — everything visible at once, no carousel */
        .panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
            gap: 1rem;
            align-items: start;
        }

        .page-section {
            background: #1a2733;
            border-radius: 10px;
            overflow: hidden;
            min-width: 0;
        }

        /* Charts read better across the full width */
        .page-section.wide {
            grid-column: 1 / -1;
        }

        .page-section-header {
            padding: 1rem 1.25rem;
            background: #1e2d3d;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.75rem;
        }

        .page-section-header h3 {
            font-size: 1rem;
            color: #fff;
        }

        .page-section-header .page-total {
            font-size: 0.8rem;
            color: #7a8b9a;
            text-align: right;
            flex-shrink: 0;
        }

        .subhead {
            padding: 1rem 1.25rem 0.35rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.75rem;
        }

        .subhead h4 {
            font-size: 0.85rem;
            color: #e0e6ed;
            font-weight: 600;
        }

        .subhead .page-total {
            font-size: 0.75rem;
            color: #4a5a6a;
        }

        /* Scrollable body for long lists */
        .scroll-body {
            max-height: 340px;
            overflow-y: auto;
        }

        .click-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid #1e2d3d;
            transition: background 0.15s;
        }

        .click-row:last-child {
            border-bottom: none;
        }

        .click-row:hover {
            background: #1e2d3d;
        }

        .click-name {
            font-size: 0.9rem;
            color: #e0e6ed;
            min-width: 0;
        }

        .click-badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .badge-primary {
            background: rgba(0, 136, 255, 0.15);
            color: #4da6ff;
        }

        .badge-secondary {
            background: rgba(0, 196, 140, 0.15);
            color: #00c48c;
        }

        .badge-nav {
            background: rgba(255, 187, 51, 0.15);
            color: #ffbb33;
        }

        .click-count {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            min-width: 46px;
            text-align: right;
            flex-shrink: 0;
        }

        /* Column charts */
        .chart {
            padding: 1rem 1.25rem 1.25rem;
        }

        .chart-cols {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 140px;
        }

        .chart-col {
            flex: 1 1 0;
            min-width: 0;
            height: 100%;
            display: flex;
            align-items: flex-end;
            border-radius: 3px;
            transition: background 0.12s;
        }

        .chart-col:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .chart-bar {
            width: 100%;
            background: linear-gradient(180deg, #0088ff, #00c48c);
            border-radius: 3px 3px 0 0;
            min-height: 3px;
        }

        /* A gap-filled zero reads as an empty slot, not a tiny value */
        .chart-bar.zero {
            background: #223140;
        }

        .chart-axis {
            display: flex;
            gap: 2px;
            margin-top: 0.5rem;
        }

        .chart-axis span {
            flex: 1 1 0;
            min-width: 0;
            font-size: 0.68rem;
            color: #4a5a6a;
            text-align: center;
            white-space: nowrap;
            overflow: visible;
        }

        .chart-empty {
            padding: 2rem 1.25rem;
            text-align: center;
            color: #4a5a6a;
            font-size: 0.85rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #4a5a6a;
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .empty-state small {
            font-size: 0.85rem;
        }

        /* Recent Clicks */
        .recent-row {
            flex-wrap: wrap;
        }

        .recent-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            min-width: 0;
        }

        .recent-page {
            font-size: 0.72rem;
            color: #4a5a6a;
            background: #1e2d3d;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .recent-time {
            font-size: 0.78rem;
            color: #4a5a6a;
            flex-shrink: 0;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: #4a5a6a;
        }

        @media (max-width: 900px) {
            .summary-row {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .dashboard {
                padding: 1.25rem 1rem 2rem;
            }

            .summary-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .summary-card .value {
                font-size: 1.6rem;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }

            /* Range tabs get their own full-width row; Updated + Refresh share the next */
            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            .range-tabs {
                order: -1;
                width: 100%;
            }

            .range-tab {
                flex: 1;
            }

            .recent-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-card">
            <h2>miniCycle Dashboard</h2>
            <p>Enter your secret to view click tracking data.</p>
            <form id="authForm" autocomplete="on">
                <input type="text" name="username" id="usernameInput" value="dashboard" autocomplete="username" hidden>
                <input type="password" class="auth-input" id="secretInput" name="dashboard-secret" placeholder="Enter secret" autocomplete="current-password" autofocus>
                <label class="auth-remember" for="rememberSecret">
                    <input type="checkbox" id="rememberSecret">
                    <span>Remember on this device</span>
                </label>
                <button type="submit" class="auth-btn" id="authBtn">View Dashboard</button>
                <p class="auth-error" id="authError">Invalid secret. Please try again.</p>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="dashboard-header">
            <h1><span>miniCycle</span> Dashboard</h1>
            <div class="header-actions">
                <div class="range-tabs" id="rangeTabs" role="group" aria-label="Date range">
                    <button type="button" class="range-tab" data-days="7">7d</button>
                    <button type="button" class="range-tab active" data-days="30">30d</button>
                    <button type="button" class="range-tab" data-days="90">90d</button>
                    <button type="button" class="range-tab" data-days="all">All</button>
                </div>
                <span class="last-updated" id="lastUpdated"></span>
                <button type="button" class="refresh-btn" id="refreshBtn">Refresh</button>
            </div>
        </div>

        <div class="error-banner" id="errorBanner" hidden></div>

        <div class="summary-row" id="summaryRow">
            <div class="summary-card">
                <div class="label">Total Clicks <span class="label-range" id="totalClicksRange"></span></div>
                <div class="value blue" id="totalClicks">0</div>
                <div class="delta" id="totalClicksDelta"></div>
            </div>
            <div class="summary-card">
                <div class="label">Page Views <span class="label-range" id="totalViewsRange"></span></div>
                <div class="value" id="totalViews">0</div>
                <div class="delta" id="totalViewsDelta"></div>
            </div>
            <div class="summary-card">
                <div class="label">Today</div>
                <div class="value green" id="todayTotal">0</div>
                <div class="delta" id="todayTotalDelta"></div>
            </div>
            <div class="summary-card">
                <div class="label">Product Page <span class="label-range" id="productTotalRange"></span></div>
                <div class="value" id="productTotal">0</div>
                <div class="delta" id="productTotalDelta"></div>
            </div>
            <div class="summary-card">
                <div class="label">Learn More <span class="label-range" id="learnMoreTotalRange"></span></div>
                <div class="value" id="learnMoreTotal">0</div>
                <div class="delta" id="learnMoreTotalDelta"></div>
            </div>
        </div>

        <div id="content">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
