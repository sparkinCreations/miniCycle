<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>miniCycle Analytics Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../assets/images/logo/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f1923;
            color: #e0e6ed;
            min-height: 100vh;
        }

        /* Auth Screen */
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .auth-card {
            background: #1a2733;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 0.5rem;
            color: #fff;
            font-size: 1.4rem;
        }

        .auth-card p {
            color: #7a8b9a;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .auth-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #2a3a4a;
            border-radius: 8px;
            background: #0f1923;
            color: #e0e6ed;
            font-size: 1rem;
            margin-bottom: 1rem;
            font-family: inherit;
        }

        .auth-input:focus {
            outline: none;
            border-color: #0088ff;
        }

        .auth-btn {
            width: 100%;
            padding: 0.8rem;
            background: #0088ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background: #0077e6;
        }

        .auth-error {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            display: none;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .dashboard-header h1 {
            font-size: 1.6rem;
            color: #fff;
        }

        .dashboard-header h1 span {
            color: #0088ff;
        }

        .header-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .refresh-btn {
            padding: 0.5rem 1rem;
            background: #1a2733;
            color: #7a8b9a;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #2a3a4a;
            color: #e0e6ed;
        }

        .last-updated {
            color: #4a5a6a;
            font-size: 0.8rem;
        }

        /* Summary Cards */
        .summary-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: #1a2733;
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
        }

        .summary-card .label {
            font-size: 0.8rem;
            color: #7a8b9a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .summary-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }

        .summary-card .value.blue { color: #0088ff; }
        .summary-card .value.green { color: #00c48c; }

        /* Page Sections */
        .page-section {
            background: #1a2733;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .page-section-header {
            padding: 1rem 1.5rem;
            background: #1e2d3d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-section-header h3 {
            font-size: 1rem;
            color: #fff;
        }

        .page-section-header .page-total {
            font-size: 0.85rem;
            color: #7a8b9a;
        }

        .click-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #1e2d3d;
            transition: background 0.15s;
        }

        .click-row:last-child {
            border-bottom: none;
        }

        .click-row:hover {
            background: #1e2d3d;
        }

        .click-name {
            font-size: 0.95rem;
            color: #e0e6ed;
        }

        .click-badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .badge-primary {
            background: rgba(0, 136, 255, 0.15);
            color: #4da6ff;
        }

        .badge-secondary {
            background: rgba(0, 196, 140, 0.15);
            color: #00c48c;
        }

        .badge-nav {
            background: rgba(255, 187, 51, 0.15);
            color: #ffbb33;
        }

        .click-count {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            min-width: 50px;
            text-align: right;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #4a5a6a;
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .empty-state small {
            font-size: 0.85rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: #4a5a6a;
        }

        @media (max-width: 600px) {
            .summary-row {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-card">
            <h2>miniCycle Analytics</h2>
            <p>Enter your secret to view click tracking data.</p>
            <input type="password" class="auth-input" id="secretInput" placeholder="Enter secret" autofocus>
            <button type="button" class="auth-btn" id="authBtn">View Dashboard</button>
            <p class="auth-error" id="authError">Invalid secret. Please try again.</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="dashboard-header">
            <h1><span>miniCycle</span> Analytics</h1>
            <div class="header-actions">
                <span class="last-updated" id="lastUpdated"></span>
                <button type="button" class="refresh-btn" id="refreshBtn">Refresh</button>
            </div>
        </div>

        <div class="summary-row" id="summaryRow">
            <div class="summary-card">
                <div class="label">Total Clicks</div>
                <div class="value blue" id="totalClicks">0</div>
            </div>
            <div class="summary-card">
                <div class="label">Product Page</div>
                <div class="value" id="productTotal">0</div>
            </div>
            <div class="summary-card">
                <div class="label">Learn More</div>
                <div class="value" id="learnMoreTotal">0</div>
            </div>
        </div>

        <div id="content">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
