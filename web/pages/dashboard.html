<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>miniCycle Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../assets/images/logo/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f1923;
            color: #e0e6ed;
            min-height: 100vh;
        }

        /* Auth Screen */
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .auth-card {
            background: #1a2733;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 0.5rem;
            color: #fff;
            font-size: 1.4rem;
        }

        .auth-card p {
            color: #7a8b9a;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .auth-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #2a3a4a;
            border-radius: 8px;
            background: #0f1923;
            color: #e0e6ed;
            font-size: 1rem;
            margin-bottom: 1rem;
            font-family: inherit;
        }

        .auth-input:focus {
            outline: none;
            border-color: #0088ff;
        }

        .auth-btn {
            width: 100%;
            padding: 0.8rem;
            background: #0088ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background: #0077e6;
        }

        .auth-error {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            display: none;
        }

        .auth-remember {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #a0aec0;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .auth-remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #0088ff;
            cursor: pointer;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .dashboard-header h1 {
            font-size: 1.6rem;
            color: #fff;
        }

        .dashboard-header h1 span {
            color: #0088ff;
        }

        .header-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .refresh-btn {
            padding: 0.5rem 1rem;
            background: #1a2733;
            color: #7a8b9a;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #2a3a4a;
            color: #e0e6ed;
        }

        .last-updated {
            color: #4a5a6a;
            font-size: 0.8rem;
        }

        /* Summary Cards */
        .summary-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: #1a2733;
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
        }

        .summary-card .label {
            font-size: 0.8rem;
            color: #7a8b9a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .summary-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }

        .summary-card .value.blue { color: #0088ff; }
        .summary-card .value.green { color: #00c48c; }

        .summary-card .delta {
            font-size: 0.75rem;
            margin-top: 0.4rem;
            color: #7a8b9a;
            font-weight: 500;
            min-height: 1em;
        }
        .summary-card .delta.up { color: #00c48c; }
        .summary-card .delta.down { color: #ff6b6b; }

        /* Carousel */
        .carousel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .carousel-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .carousel-arrow {
            background: #1a2733;
            border: 1px solid #2a3a4a;
            color: #e0e6ed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-family: inherit;
            transition: background 0.15s, opacity 0.15s;
            flex-shrink: 0;
        }

        .carousel-arrow:hover:not(:disabled) {
            background: #2a3a4a;
        }

        .carousel-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .carousel-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            min-width: 0;
        }

        .carousel-label {
            color: #e0e6ed;
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .carousel-dots {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2a3a4a;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
        }

        .carousel-dot:hover {
            background: #3a4a5a;
        }

        .carousel-dot.active {
            background: #0088ff;
            transform: scale(1.3);
        }

        .carousel-viewport {
            overflow: hidden;
            border-radius: 10px;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.3s ease;
        }

        .carousel-slide {
            flex: 0 0 100%;
            min-width: 0;
            max-height: calc(100vh - 280px);
            overflow-y: auto;
        }

        /* Page Sections */
        .page-section {
            background: #1a2733;
            border-radius: 10px;
            overflow: hidden;
        }

        .page-section-header {
            padding: 1rem 1.5rem;
            background: #1e2d3d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-section-header h3 {
            font-size: 1rem;
            color: #fff;
        }

        .page-section-header .page-total {
            font-size: 0.85rem;
            color: #7a8b9a;
        }

        .click-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #1e2d3d;
            transition: background 0.15s;
        }

        .click-row:last-child {
            border-bottom: none;
        }

        .click-row:hover {
            background: #1e2d3d;
        }

        .click-name {
            font-size: 0.95rem;
            color: #e0e6ed;
        }

        .click-badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .badge-primary {
            background: rgba(0, 136, 255, 0.15);
            color: #4da6ff;
        }

        .badge-secondary {
            background: rgba(0, 196, 140, 0.15);
            color: #00c48c;
        }

        .badge-nav {
            background: rgba(255, 187, 51, 0.15);
            color: #ffbb33;
        }

        .click-count {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            min-width: 50px;
            text-align: right;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #4a5a6a;
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .empty-state small {
            font-size: 0.85rem;
        }

        /* Daily Activity */
        .daily-row {
            display: flex;
            align-items: center;
            padding: 0.6rem 1.5rem;
            border-bottom: 1px solid #1e2d3d;
            gap: 1rem;
        }

        .daily-row:last-child {
            border-bottom: none;
        }

        .daily-date {
            font-size: 0.85rem;
            color: #7a8b9a;
            min-width: 55px;
        }

        .daily-bar-container {
            flex: 1;
            height: 8px;
            background: #1e2d3d;
            border-radius: 4px;
            overflow: hidden;
        }

        .daily-bar {
            height: 100%;
            background: linear-gradient(90deg, #0088ff, #00c48c);
            border-radius: 4px;
            min-width: 2px;
            transition: width 0.3s ease;
        }

        .daily-count {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e0e6ed;
            min-width: 30px;
            text-align: right;
        }

        /* Recent Clicks */
        .recent-row {
            flex-wrap: wrap;
        }

        .recent-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

        .recent-page {
            font-size: 0.75rem;
            color: #4a5a6a;
            background: #1e2d3d;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }

        .recent-time {
            font-size: 0.8rem;
            color: #4a5a6a;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: #4a5a6a;
        }

        @media (max-width: 900px) {
            .summary-row {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .summary-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .carousel-arrow {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }

            .carousel-label {
                font-size: 0.85rem;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .recent-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-card">
            <h2>miniCycle Dashboard</h2>
            <p>Enter your secret to view click tracking data.</p>
            <form id="authForm" autocomplete="on">
                <input type="text" name="username" id="usernameInput" value="dashboard" autocomplete="username" hidden>
                <input type="password" class="auth-input" id="secretInput" name="dashboard-secret" placeholder="Enter secret" autocomplete="current-password" autofocus>
                <label class="auth-remember" for="rememberSecret">
                    <input type="checkbox" id="rememberSecret">
                    <span>Remember on this device</span>
                </label>
                <button type="submit" class="auth-btn" id="authBtn">View Dashboard</button>
                <p class="auth-error" id="authError">Invalid secret. Please try again.</p>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="dashboard-header">
            <h1><span>miniCycle</span> Dashboard</h1>
            <div class="header-actions">
                <span class="last-updated" id="lastUpdated"></span>
                <button type="button" class="refresh-btn" id="refreshBtn">Refresh</button>
            </div>
        </div>

        <div class="summary-row" id="summaryRow">
            <div class="summary-card">
                <div class="label">Total Clicks</div>
                <div class="value blue" id="totalClicks">0</div>
                <div class="delta" id="totalClicksDelta"></div>
            </div>
            <div class="summary-card">
                <div class="label">Page Views</div>
                <div class="value" id="totalViews">0</div>
                <div class="delta" id="totalViewsDelta"></div>
            </div>
            <div class="summary-card">
                <div class="label">Today</div>
                <div class="value green" id="todayTotal">0</div>
                <div class="delta" id="todayTotalDelta"></div>
            </div>
            <div class="summary-card">
                <div class="label">Product Page</div>
                <div class="value" id="productTotal">0</div>
                <div class="delta" id="productTotalDelta"></div>
            </div>
            <div class="summary-card">
                <div class="label">Learn More</div>
                <div class="value" id="learnMoreTotal">0</div>
                <div class="delta" id="learnMoreTotalDelta"></div>
            </div>
        </div>

        <div id="content">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
