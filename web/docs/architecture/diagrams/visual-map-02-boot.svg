    <circle cx="243.6" cy="373.7" r="9" fill="#3b63d8"/>
    <text x="243.6" y="377.2" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text>
    <text x="258.6" y="379.1" font-size="12" font-weight="700" fill="#1b2540">build deps</text>
    <text x="234.6" y="396.1" xml:space="preserve" font-size="10.5" fill="#6b7893">only what the manifest</text>
    <text x="234.6" y="410.8" xml:space="preserve" font-size="10.5" fill="#6b7893">declares</text>
    <text x="234.6" y="425.5" xml:space="preserve" font-size="10.5" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#1b2540">ENFORCE_REQUIRES on</text>
  </g>
  <path d="M386.2,398.25 L418.2,398.25" stroke="#8a97b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
