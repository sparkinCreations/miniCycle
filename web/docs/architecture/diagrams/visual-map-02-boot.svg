  <text x="28" y="311.3" font-size="10.5" fill="#6b7893">Modules in one phase import in parallel. Wiring and init run one at a time, so same-phase providers have registered before a consumer wires.</text>
  <text x="28" y="345.3" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#6b7893">PER-MODULE LIFECYCLE — LOADMODULE() THEN INITIALIZEMODULE()</text>
  <g data-box="1">
    <rect x="28.0" y="357.3" width="161.6" height="81.9" rx="10" fill="#ffffff" stroke="#d5dbe8" filter="url(#shadow)"/>
    <circle cx="48.0" cy="373.7" r="9" fill="#3b63d8"/>
    <text x="48.0" y="377.2" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text>
    <text x="63.0" y="379.1" font-size="12" font-weight="700" fill="#1b2540">import()</text>
    <text x="39.0" y="396.1" xml:space="preserve" font-size="10.5" fill="#6b7893">manifest.path with ?v=</text>
    <text x="39.0" y="410.8" xml:space="preserve" font-size="10.5" fill="#6b7893">perf mark recorded</text>
  </g>
  <path d="M190.6,398.25 L222.6,398.25" stroke="#8a97b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
