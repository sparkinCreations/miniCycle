    <circle cx="830.4" cy="373.7" r="9" fill="#3b63d8"/>
    <text x="830.4" y="377.2" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">5</text>
    <text x="845.4" y="379.1" font-size="12" font-weight="700" fill="#1b2540">registerProvides()</text>
    <text x="821.4" y="396.1" xml:space="preserve" font-size="10.5" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#1b2540">provides[] → deps.api</text>
    <text x="821.4" y="410.8" xml:space="preserve" font-size="10.5" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#1b2540">instance → deps.api.x</text>
  </g>
  <g data-box="1">
    <rect x="28" y="465.20000000000005" width="464.0" height="118.3" rx="10" fill="#fff7e3" stroke="#e2b93b" filter="url(#shadow)"/>
    <text x="40" y="488.00000000000006" font-size="12" font-weight="700" fill="#1b2540">Core-ready is not state-ready</text>
    <text x="40" y="505.0" xml:space="preserve" font-size="10.5" fill="#6b4f00">After waitForCore() a returning user has data and isReady() is true. A first-run user has</text>
    <text x="40" y="519.7" xml:space="preserve" font-size="10.5" fill="#6b4f00">data = null: get() returns null and update() is a no-op until the first-run screen persists a</text>
    <text x="40" y="534.4" xml:space="preserve" font-size="10.5" fill="#6b4f00">routine.</text>
    <text x="40" y="554.1" xml:space="preserve" font-size="10.5" fill="#6b4f00">Guard reads; do not assume writes land. Do not make waitForCore() await isReady() —</text>
    <text x="40" y="568.8" xml:space="preserve" font-size="10.5" fill="#6b4f00">that deadlocks boot (measured Aug 2026). Pinned by the first-run state contract journey.</text>
  </g>
  <g data-box="1">
    <rect x="508.0" y="465.20000000000005" width="464.0" height="118.3" rx="10" fill="#e8f5ee" stroke="#7cc49a" filter="url(#shadow)"/>
    <text x="520.0" y="488.00000000000006" font-size="12" font-weight="700" fill="#1b2540">Safety nets around the sequence</text>
    <text x="520.0" y="505.0" xml:space="preserve" font-size="10.5" fill="#1e5e3a">16 s late fallback: gate wanted lite, or boot never started → lite/</text>
    <text x="520.0" y="519.7" xml:space="preserve" font-size="10.5" fill="#1e5e3a">60 s load timeout: #app-loader still visible → lite/</text>
    <text x="520.0" y="534.4" xml:space="preserve" font-size="10.5" fill="#1e5e3a">Boot failure counter: 2 consecutive failures → caches cleared, retry</text>
    <text x="520.0" y="549.1" xml:space="preserve" font-size="10.5" fill="#1e5e3a">destroyAllModules() on retry calls every module&#x27;s destroy()</text>
    <text x="520.0" y="568.8" xml:space="preserve" font-size="10.5" fill="#6b7893">Phase timeouts live in core/constants.js (BOOT_TIMEOUTS).</text>
  </g>
