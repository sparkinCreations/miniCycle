    <text x="439.2" y="377.2" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text>
    <text x="454.2" y="379.1" font-size="12" font-weight="700" fill="#1b2540">setXDependencies()</text>
    <text x="430.2" y="396.1" xml:space="preserve" font-size="10.5" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#1b2540">Object.defineProperties</text>
    <text x="430.2" y="410.8" xml:space="preserve" font-size="10.5" fill="#6b7893">getters stay lazy</text>
  </g>
