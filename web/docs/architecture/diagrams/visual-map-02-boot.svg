    <text x="649.8" y="379.1" font-size="12" font-weight="700" fill="#1b2540">init(deps)</text>
    <text x="625.8" y="396.1" xml:space="preserve" font-size="10.5" fill="#6b7893">constructs the instance</text>
    <text x="625.8" y="410.8" xml:space="preserve" font-size="10.5" fill="#6b7893">facades load sub-modules</text>
    <text x="625.8" y="425.5" xml:space="preserve" font-size="10.5" fill="#6b7893">here</text>
