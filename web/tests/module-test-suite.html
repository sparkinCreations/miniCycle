<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#5680ff">
    <title>🧪 miniCycle Module Test Suite</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/logo/taskcycle_logo_blackandwhite_transparent.png" />

    <!-- Fonts -->
    <!-- Fonts removed: blocked by production CSP (font-src 'self'), caused 504 Gateway Timeouts.
         Tests don't need web fonts — they only check logic, not visual rendering. -->

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #4c79ff;
            --bg-gradient-end: #74c0fc;
            --text-color: white;
            --card-bg: rgba(255, 255, 255, 0.15);
            --card-text: white;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-text: #333;
            --button-bg: rgba(255, 255, 255, 0.95);
            --button-text: #4c79ff;
            --border-color: rgba(255, 255, 255, 0.3);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --result-bg: rgba(255, 255, 255, 0.95);
            --result-text: #333;
            --test-section-border: rgba(255, 255, 255, 0.3);
        }

        body.dark-mode {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --text-color: #e0e0e0;
            --card-bg: rgba(30, 30, 50, 0.8);
            --card-text: #e0e0e0;
            --input-bg: #2a2a3e;
            --input-text: #e0e0e0;
            --button-bg: #3a3a5e;
            --button-text: #74c0fc;
            --border-color: rgba(116, 192, 252, 0.3);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --result-bg: #2a2a3e;
            --result-text: #e0e0e0;
            --test-section-border: rgba(116, 192, 252, 0.3);
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 20px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.95;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .module-selector {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: background 0.3s ease;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .controls-row input {
            flex: 1;
        }

        .controls-row button {
            margin: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: var(--card-text);
        }

        select, input[type="search"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background: var(--input-bg);
            color: var(--input-text);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        select {
            cursor: pointer;
            padding: 8px 12px;
        }

        select option {
            padding: 8px 12px;
            margin: 2px 0;
        }

        select option:hover {
            background: var(--button-text);
            color: white;
        }

        select:hover, input[type="search"]:hover {
            border-color: var(--button-text);
        }

        select:focus, input[type="search"]:focus {
            outline: none;
            border-color: var(--button-text);
            box-shadow: 0 0 0 3px rgba(116, 192, 252, 0.2);
        }

        input[type="search"] {
            cursor: text;
            padding: 12px 16px;
        }

        button {
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px 0 0;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow-color);
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--shadow-color);
            opacity: 0.9;
        }

        button:active {
            transform: translateY(0);
        }

        #dark-mode-toggle {
            background: transparent;
            border: 2px solid var(--border-color);
            padding: 8px 16px;
            font-size: 24px;
            line-height: 1;
        }

        #dark-mode-toggle:hover {
            background: var(--card-bg);
        }

        #results {
            margin-top: 30px;
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 25px 0 15px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 20px 0 15px;
            opacity: 0.95;
        }

        .test-section {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 25px 0 10px;
            padding: 8px 0;
            border-bottom: 2px solid var(--test-section-border);
            color: var(--text-color);
        }

        .result {
            background: var(--result-bg);
            color: var(--result-text);
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 0.95rem;
            box-shadow: 0 2px 6px var(--shadow-color);
            transition: transform 0.2s ease, background 0.3s ease;
        }

        .result:hover {
            transform: translateX(4px);
        }

        .result.hidden {
            display: none;
        }

        /* Light mode - high contrast pass/fail */
        .result.pass,
        div.result.pass {
            border-left: 4px solid #16a34a !important;
            background-color: #f0fdf4 !important;
            color: #000000 !important;
            font-weight: 600 !important;
        }

        .result.fail,
        div.result.fail {
            border-left: 4px solid #dc2626 !important;
            background-color: #fef2f2 !important;
            color: #000000 !important;
            font-weight: 600 !important;
        }


        .no-results {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: var(--text-color);
            margin: 20px 0;
        }

        /* Summary table styles for dark mode */
        table {
            color: var(--text-color);
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        body.dark-mode tbody tr {
            background-color: rgba(30, 30, 50, 0.5) !important;
        }

        body.dark-mode tbody tr:hover {
            background-color: rgba(50, 50, 70, 0.7) !important;
        }

        body.dark-mode tfoot tr {
            background-color: rgba(40, 40, 60, 0.8) !important;
        }

        body.dark-mode th {
            color: var(--text-color);
        }

        .test-element,
        #test-element,
        #test-element-2,
        .selector-test {
            display: none !important;
            visibility: hidden !important;
            position: absolute !important;
            left: -9999px !important;
            top: -9999px !important;
            width: 0 !important;
            height: 0 !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .module-selector {
                padding: 15px;
            }
        }
    </style>
</head>

        // Uses same DB as test results for simplicity
        const TEST_MODE_DB = 'miniCycleTestResultsDB';
        const TEST_MODE_STORE = 'results';

        async function setTestModeFlag(active) {
            // 🧪 Set IndexedDB flag - single source of truth for test mode
            // appState.js checks IndexedDB directly (async) to skip saves during tests
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open(TEST_MODE_DB, 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(TEST_MODE_STORE)) {
                            db.createObjectStore(TEST_MODE_STORE, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = () => {
                        const db = request.result;
                        const tx = db.transaction(TEST_MODE_STORE, 'readwrite');
                        const store = tx.objectStore(TEST_MODE_STORE);
                        if (active) {
                            store.put({ id: 'testModeActive', active: true, timestamp: Date.now() });
                        } else {
                            store.delete('testModeActive');
                        }
                        tx.oncomplete = () => {
                            db.close();
                            resolve(true);
                        };
                        tx.onerror = () => {
                            db.close();
                            resolve(false);
                        };
                    };
                    request.onerror = () => resolve(false);
                } catch (e) {
                    console.warn('Could not set test mode flag:', e);
                    resolve(false);
                }
            });
        }

        /**
         * Backup localStorage to IndexedDB before tests run
         * ALWAYS creates a fresh backup of current localStorage state
         * @returns {Promise<{action: string, backupKeys: number}>}
         */
        async function backupLocalStorageToIndexedDB() {
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open(TEST_MODE_DB, 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(TEST_MODE_STORE)) {
                            db.createObjectStore(TEST_MODE_STORE, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = () => {
                        const db = request.result;

                        // ALWAYS capture current localStorage state (fresh backup)
                        const backup = {};
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (key) {
                                backup[key] = localStorage.getItem(key);
                            }
                        }

                        const keyCount = Object.keys(backup).length;
                        console.log(`%c💾 Creating fresh IndexedDB backup: ${keyCount} localStorage keys`, 'background: blue; color: white; padding: 2px 6px;');

                        const writeTx = db.transaction(TEST_MODE_STORE, 'readwrite');
                        const writeStore = writeTx.objectStore(TEST_MODE_STORE);
                        writeStore.put({
                            id: 'preTestBackup',
                            localStorageBackup: backup,
                            timestamp: Date.now()
                        });
                        writeTx.oncomplete = () => {
                            db.close();
                            resolve({ action: 'created-fresh-backup', backupKeys: keyCount });
                        };
                        writeTx.onerror = () => {
                            db.close();
                            resolve({ action: 'error-write-failed', backupKeys: 0 });
                        };
                    };
                    request.onerror = () => {
                        resolve({ action: 'error-db-open-failed', backupKeys: 0 });
                    };
                } catch (e) {
                    resolve({ action: 'error-exception', backupKeys: 0, error: e.message });
                }
            });
        }

        /**
         * Clear the backup from IndexedDB after tests complete successfully
         */
        async function clearLocalStorageBackup() {
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open(TEST_MODE_DB, 1);
                    request.onsuccess = () => {
                        const db = request.result;
                        const tx = db.transaction(TEST_MODE_STORE, 'readwrite');
                        const store = tx.objectStore(TEST_MODE_STORE);
                        store.delete('preTestBackup');
                        tx.oncomplete = () => {
                            db.close();
                            resolve(true);
                        };
                        tx.onerror = () => {
                            db.close();
                            resolve(false);
                        };
                    };
                    request.onerror = () => resolve(false);
                } catch (e) {
                    resolve(false);
                }
            });
        }

        /**
         * Restore localStorage from IndexedDB backup
         * @returns {Promise<{success: boolean, keysRestored: number}>}
         */
        async function restoreLocalStorageFromBackup() {
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open(TEST_MODE_DB, 1);
                    request.onerror = () => resolve({ success: false, keysRestored: 0, error: 'Could not open DB' });
                    request.onsuccess = () => {
                        const db = request.result;
                        const tx = db.transaction(TEST_MODE_STORE, 'readonly');
                        const store = tx.objectStore(TEST_MODE_STORE);
                        const getBackup = store.get('preTestBackup');

                        getBackup.onsuccess = () => {
                            const result = getBackup.result;
                            db.close();

                            if (result && result.localStorageBackup) {
                                const backup = result.localStorageBackup;
                                const keys = Object.keys(backup);

                                console.log(`%c📦 Found IndexedDB backup with ${keys.length} keys`, 'background: blue; color: white; padding: 2px 6px;');

                                // Clear localStorage and restore from backup
                                localStorage.clear();
                                keys.forEach(key => {
                                    localStorage.setItem(key, backup[key]);
                                });

                                resolve({ success: true, keysRestored: keys.length, keys });
                            } else {
                                resolve({ success: false, keysRestored: 0, error: 'No backup found in IndexedDB' });
                            }
                        };
                        getBackup.onerror = () => {
                            db.close();
                            resolve({ success: false, keysRestored: 0, error: 'Query failed' });
                        };
                    };
                } catch (e) {
                    resolve({ success: false, keysRestored: 0, error: e.message });
                }
            });
        }

                if (!query) {
                    option.style.display = '';
                    visibleCount++;

                    const text = option.textContent.toLowerCase();
                    if (text.includes(query)) {
                        option.style.display = '';
                        visibleCount++;

                const productionSkipList = ['moduleLoader', 'orchestrator'];

                for (const module of allModules) {
                    moduleIndex++;

                    if (isProduction && productionSkipList.includes(module.key)) {
                        allResults.push({ name: module.name, passed: 0, total: 0, skipped: true });
                        continue;
                    }

                    // Send progress update to parent (if embedded)
                    const isEmbedded = new URLSearchParams(window.location.search).get('embedded') === 'true';
                    if (isEmbedded && window.parent !== window) {
                        window.parent.postMessage({

                            moduleName: module.name,
                            currentIndex: moduleIndex,
                            totalModules: totalModuleCount
                        }, '*');
                    }

                    try {
                        // 🔍 VALIDATE: IndexedDB backup before each module
                        await validateBackupIntegrity(`before ${module.name}`);

                        // Load and expose the module using shared helper
                        // This ensures consistent window.* exposure for all modules
                        await loadAndExposeModule(module.key);

                    // Create a temporary div for results
                    const tempDiv = document.createElement('div');

                    // Run the tests with a 30-second timeout per module
                    const MODULE_TIMEOUT_MS = 30000;
                    let result;

                    const testPromise = module.runFn(tempDiv, true);
                    const timeoutPromise = new Promise((_, reject) => {
                        setTimeout(() => reject(new Error('TIMEOUT')), MODULE_TIMEOUT_MS);
                    });

                    try {
                        result = await Promise.race([testPromise, timeoutPromise]);
                    } catch (timeoutError) {
                        if (timeoutError.message === 'TIMEOUT') {
                            console.warn(`⏱️ Module "${module.name}" timed out after ${MODULE_TIMEOUT_MS / 1000}s`);
                            allResults.push({
                                name: module.name,
                                passed: 0,
                                total: 1,
                                timedOut: true,
                                html: `<div class="result fail">⏱️ TIMED OUT after ${MODULE_TIMEOUT_MS / 1000} seconds - skipped</div>`
                            });
                            totalTests += 1; // Count as 1 failed test
                            continue; // Skip to next module
                        }
                        throw timeoutError; // Re-throw non-timeout errors
                    }

                    // Store results
                    allResults.push({
                        name: module.name,
                        passed: result?.passed || 0,
                        total: result?.total || 0,
                        html: tempDiv.innerHTML
                    });

                    totalPassed += (result?.passed || 0);
                    totalTests += (result?.total || 0);

                    // 🔍 VALIDATE: IndexedDB backup after each module
                    await validateBackupIntegrity(`after ${module.name}`);

                } catch (error) {
                    allResults.push({
                        name: module.name,
                        passed: 0,
                        total: 0,
                        error: error.message,
                        html: `<div class="result fail">❌ Failed to run tests: ${error.message}</div>`
                    });
                    }
                }

                const endTime = performance.now();
                const duration = ((endTime - startTime) / 1000).toFixed(2);

                // Display aggregated results

            // Summary table - check dark mode for colors

            const summaryText = isDarkMode ? '#e0e0e0' : '#333';
            const headerBorder = isDarkMode ? '#4a4a6a' : '#ddd';

            const failRowBg = isDarkMode ? '#7f1d1d' : '#fee2e2';

            output += '<table style="width: 100%; border-collapse: collapse;">';
            output += `<thead><tr style="border-bottom: 2px solid ${headerBorder};"><th style="text-align: left; padding: 8px;">Module</th><th style="text-align: right; padding: 8px;">Passed</th><th style="text-align: right; padding: 8px;">Total</th><th style="text-align: right; padding: 8px;">Status</th></tr></thead>`;
            output += '<tbody>';

            for (const result of allResults) {
                const passRate = result.total > 0 ? (result.passed / result.total * 100).toFixed(0) : 0;
                let statusEmoji, rowBg, rowText, statusText;

                if (result.skipped) {
                    statusEmoji = '⏭️';
                    statusText = 'SKIPPED';
                    rowBg = isDarkMode ? '#3a3a5a' : '#f0f0f0';
                    rowText = isDarkMode ? '#aaaaaa' : '#888888';
                } else if (result.timedOut) {
                    statusEmoji = '⏱️';
                    statusText = 'TIMEOUT';
                    rowBg = isDarkMode ? '#7c4700' : '#fef3c7'; // Orange/yellow for timeout
                    rowText = isDarkMode ? '#ffffff' : '#92400e';
                } else if (result.passed === result.total) {
                    statusEmoji = '✅';
                    statusText = `${passRate}%`;
                    rowBg = passRowBg;
                    rowText = passRowText;
                } else {
                    statusEmoji = '❌';
                    statusText = `${passRate}%`;
                    rowBg = failRowBg;
                    rowText = failRowText;
                }

                output += `<tr style="border-bottom: 1px solid ${rowBorder}; background: ${rowBg}; color: ${rowText};">`;
                output += `<td style="padding: 8px; font-weight: 600;">${result.name}</td>`;
                output += `<td style="text-align: right; padding: 8px;">${result.passed}</td>`;
                output += `<td style="text-align: right; padding: 8px;">${result.total}</td>`;
                output += `<td style="text-align: right; padding: 8px;">${statusEmoji} ${statusText}</td>`;
                output += '</tr>';
            }

            output += '</tbody>';
            output += `<tfoot><tr style="border-top: 2px solid ${summaryText}; font-weight: bold; background: ${footerBg}; color: ${summaryText};"><td style="padding: 8px;">TOTAL</td><td style="text-align: right; padding: 8px;">${totalPassed}</td><td style="text-align: right; padding: 8px;">${totalTests}</td><td style="text-align: right; padding: 8px;">${totalPassed === totalTests ? '✅' : '❌'} ${totalTests > 0 ? (totalPassed / totalTests * 100).toFixed(0) : 0}%</td></tr></tfoot>`;
            output += '</table>';
            output += '</div>';

            output += '<h3 style="margin-top: 30px;">📋 Detailed Results</h3>';

                resultsDiv.innerHTML = output;

                // 📤 Send results back to opener if this was an autorun request
                if (new URLSearchParams(window.location.search).get('autorun') === 'true') {
                    const failedModules = allResults.filter(r => r.passed !== r.total);
                    const resultData = {
                        type: 'TEST_RESULTS',
                        totalPassed,
                        totalTests,
                        duration,
                        allPassed: totalPassed === totalTests,
                        failedModules: failedModules.map(m => ({
                            name: m.name,
                            passed: m.passed,
                            total: m.total,
                            error: m.error
                        })),
                        timestamp: Date.now()
                    };

                    // Store in IndexedDB for pickup by testing modal, then notify opener
                    const storeAndNotify = () => {
                        return new Promise((resolve) => {
                            try {
                                const dbRequest = indexedDB.open('miniCycleTestResultsDB', 1);
                                dbRequest.onupgradeneeded = (e) => {
                                    const db = e.target.result;
                                    if (!db.objectStoreNames.contains('results')) {
                                        db.createObjectStore('results', { keyPath: 'id' });
                                    }
                                };
                                dbRequest.onsuccess = () => {
                                    const db = dbRequest.result;
                                    const tx = db.transaction('results', 'readwrite');
                                    tx.objectStore('results').put({ id: 'latest', ...resultData });
                                    tx.oncomplete = () => {
                                        db.close();
                                        console.log('💾 Stored test results in IndexedDB');
                                        resolve();
                                    };
                                    tx.onerror = () => resolve();
                                };
                                dbRequest.onerror = () => resolve();
                            } catch (e) {
                                console.warn('Failed to store results in IndexedDB:', e);
                                resolve();
                            }
                        });
                    };

                    await storeAndNotify();

                    // Send results via postMessage
                    const isEmbedded = new URLSearchParams(window.location.search).get('embedded') === 'true';
                    if (isEmbedded && window.parent !== window) {
                        // Embedded in iframe - send to parent
                        window.parent.postMessage(resultData, '*');
                        console.log('📤 Sent test results to parent (embedded mode)');
                    } else if (window.opener) {
                        // Popup window - send to opener
                        window.opener.postMessage(resultData, '*');
                        window.opener.focus();
                        console.log('📤 Sent test results to opener and focused');
                    }
                }

            } catch (error) {
                console.error('❌ Fatal error during test execution:', error);
                resultsDiv.innerHTML += `<div class="result fail">❌ Fatal error: ${error.message}</div>`;
            } finally {
                // 🔒 Clear cross-window test flag so other tabs resume sync

                window.setTimeout = originalSetTimeout;
                localStorage.clear = originalLocalStorageClear;

                // ⏱️ WAIT for any debounced saves to complete (always runs, even after errors)
                console.log('%c⏱️ Waiting for debounced saves to settle...', 'background: #333; color: #fff; padding: 2px 6px;');
                await new Promise(resolve => setTimeout(resolve, 700));

                // 🔒 RESTORE REAL APP DATA from IndexedDB backup after all tests complete
                console.log('%c🔄 Restoring localStorage from IndexedDB backup...', 'background: #333; color: #fff; padding: 2px 6px;');
                const restoreResult = await restoreLocalStorageFromBackup();

                let restorationVerified = false;

                if (restoreResult.success) {
                    console.log(`%c✅ localStorage restored: ${restoreResult.keysRestored} keys from IndexedDB`, 'background: green; color: white; padding: 2px 6px;');

                    // 🔍 VERIFY restoration by checking keys were restored
                    if (restoreResult.keysRestored > 0) {
                        restorationVerified = true;
                    } else {
                        // Backup had 0 keys - user had empty localStorage before tests
                        restorationVerified = true;
                    }
                } else {
                    // IndexedDB restore failed - do NOT clear flags, keep backup for next refresh
                    console.error(`%c❌ IndexedDB restore FAILED: ${restoreResult.error}`, 'background: red; color: white; padding: 2px 6px;');
                    console.error('   Backup will be preserved - appState.js will restore on next page load');
                }

                // 🛡️ POST-RESTORE VERIFICATION: Wait and check that nothing overwrote the data
                if (restorationVerified && restoreResult.keysRestored > 0) {
                    // Capture what we just restored for comparison
                    const expectedData = localStorage.getItem('miniCycleData');

                    // Wait for any stale async operations to fire
                    await new Promise(resolve => setTimeout(resolve, 500));

                    // Check if data was overwritten by a stale write
                    const currentData = localStorage.getItem('miniCycleData');
                    if (expectedData && currentData !== expectedData) {
                        console.warn('%c⚠️ POST-RESTORE: Data was overwritten by stale async operation! Re-restoring...', 'background: orange; color: black; padding: 2px 6px;');
                        const reRestoreResult = await restoreLocalStorageFromBackup();
                        if (reRestoreResult.success) {
                            console.log(`%c✅ Re-restored ${reRestoreResult.keysRestored} keys successfully`, 'background: green; color: white; padding: 2px 6px;');
                        } else {
                            console.error('%c❌ Re-restore FAILED', 'background: red; color: white; padding: 2px 6px;');
                            restorationVerified = false;
                        }
                    } else {
                        console.log('%c✅ Post-restore verification passed - data intact', 'background: green; color: white; padding: 2px 6px;');
                    }
                }

                // 🚦 ONLY clear flags and backup if restoration was verified successful
                if (restorationVerified) {
                    // Clear test mode flag
                    await setTestModeFlag(false);
                    console.log('🚦 Test mode flag CLEARED');

                    // Clear backup - no longer needed since restoration verified
                    await clearLocalStorageBackup();
                    console.log('💾 IndexedDB backup cleared - restoration verified successful');

                    console.warn('%c⚠️ KEEPING BACKUP - restoration not verified, backup preserved for next refresh', 'background: orange; color: black; padding: 2px 6px;');

                    console.error('   ⚠️ IndexedDB backup was lost at some point during testing');
                    console.error('   ⚠️ This should NOT happen - IndexedDB is separate from localStorage');
                    console.error('   ⚠️ Check if any test deletes the miniCycleTestResultsDB database');
                } else {
                    console.log('%c✅ All IndexedDB backup checks passed!', 'background: green; color: white; padding: 2px 6px;');
                    console.log('   - Backup remained intact throughout all test modules');
                    console.log('   - User data was safely preserved in IndexedDB during tests');
                }

                // 🔄 If opened via autorun (popup mode only), reload the opener to pick up restored data
                // Skip reload if embedded - parent will handle closing the iframe
                const urlParams = new URLSearchParams(window.location.search);
                const isAutorun = urlParams.get('autorun') === 'true';
                const isEmbedded = urlParams.get('embedded') === 'true';

                if (isAutorun && !isEmbedded && window.opener) {
                    console.log('🔄 Reloading opener to ensure clean state...');
                    try {
                        window.opener.location.reload();
                    } catch (e) {
                        console.warn('Could not reload opener:', e);
                    }
                }
            }
        });

        // Convert only failed tests to plain text format
        function convertFailedTestsToText() {
            const h2 = resultsDiv.querySelector('h2');
            let text = '';

            // Check if this is "Run All Tests" results (has a table)
            const summaryTable = resultsDiv.querySelector('table');

            if (summaryTable) {
                // Count total failures first
                const allFailedResults = resultsDiv.querySelectorAll('.result.fail');
                if (allFailedResults.length === 0) {
                    return '';
                }

                text += '='.repeat(80) + '\n';
                text += '❌ FAILED TESTS (' + allFailedResults.length + ' failures)\n';
                text += '='.repeat(80) + '\n\n';

                // Group failures by module
                const moduleBlocks = resultsDiv.querySelectorAll('div[style*="margin: 20px 0"]');
                moduleBlocks.forEach(block => {
                    const h4 = block.querySelector('h4');
                    const failedResults = block.querySelectorAll('.result.fail');

                    if (failedResults.length > 0 && h4) {
                        text += '\n' + h4.textContent + ' (' + failedResults.length + ' failed)\n';
                        text += '-'.repeat(h4.textContent.length + 10) + '\n';

                        failedResults.forEach(result => {
                            text += '❌ ' + result.textContent + '\n';
                        });
                    }
                });

            } else {
                // Single module format
                const failedResults = resultsDiv.querySelectorAll('.result.fail');
                if (failedResults.length === 0) {
                    return '';
                }

                text += '='.repeat(80) + '\n';
                text += '❌ FAILED TESTS (' + failedResults.length + ' failures)\n';
                if (h2) {
                    text += 'Module: ' + h2.textContent + '\n';
                }
                text += '='.repeat(80) + '\n\n';

                let currentSection = '';
                failedResults.forEach(result => {
                    // Check for section header
                    let prevSibling = result.previousElementSibling;
                    while (prevSibling) {
                        if (prevSibling.classList && prevSibling.classList.contains('test-section')) {
                            if (currentSection !== prevSibling.textContent) {
                                currentSection = prevSibling.textContent;
                                text += '\n' + currentSection + '\n';
                                text += '-'.repeat(currentSection.length) + '\n';
                            }
                            break;
                        }
                        prevSibling = prevSibling.previousElementSibling;
                    }

                    text += '❌ ' + result.textContent + '\n';
                });
            }

            text += '\n' + '='.repeat(80) + '\n';
            return text;
        }

        // Convert HTML results to plain text format
        function convertResultsToText() {
            const h2 = resultsDiv.querySelector('h2');
            const h3 = resultsDiv.querySelector('h3');

            let text = '='.repeat(80) + '\n';
            text += h2 ? h2.textContent + '\n' : 'Test Results\n';
            text += '='.repeat(80) + '\n\n';

            // Check if this is "Run All Tests" results (has a table)
            const summaryTable = resultsDiv.querySelector('table');

            if (summaryTable) {
                // This is "Run All Tests" format
                if (h3) {
                    text += h3.textContent + '\n\n';
                }

                // Extract table data
                text += '📊 SUMMARY\n';
                text += '-'.repeat(80) + '\n';
                text += String('Module').padEnd(25) + String('Passed').padStart(10) + String('Total').padStart(10) + String('Status').padStart(15) + '\n';
                text += '-'.repeat(80) + '\n';

                const rows = summaryTable.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    if (cells.length >= 4) {
                        const module = cells[0].textContent.padEnd(25);
                        const passed = cells[1].textContent.padStart(10);
                        const total = cells[2].textContent.padStart(10);
                        const status = cells[3].textContent.padStart(15);
                        text += module + passed + total + status + '\n';
                    }
                });

                // Add footer total
                const footer = summaryTable.querySelector('tfoot tr');
                if (footer) {
                    const cells = footer.querySelectorAll('td');
                    if (cells.length >= 4) {
                        text += '-'.repeat(80) + '\n';
                        const module = cells[0].textContent.padEnd(25);
                        const passed = cells[1].textContent.padStart(10);
                        const total = cells[2].textContent.padStart(10);
                        const status = cells[3].textContent.padStart(15);
                        text += module + passed + total + status + '\n';
                    }
                }
                text += '='.repeat(80) + '\n\n';

                // Add detailed results
                const detailedHeading = Array.from(resultsDiv.querySelectorAll('h3')).find(h => h.textContent.includes('Detailed Results'));
                if (detailedHeading) {
                    text += detailedHeading.textContent + '\n';
                    text += '='.repeat(80) + '\n\n';

                    const moduleBlocks = resultsDiv.querySelectorAll('div[style*="margin: 20px 0"]');
                    moduleBlocks.forEach(block => {
                        const h4 = block.querySelector('h4');
                        if (h4) {
                            text += '\n' + h4.textContent + '\n';
                            text += '-'.repeat(h4.textContent.length) + '\n';
                        }

                        const results = block.querySelectorAll('.result');
                        results.forEach(result => {
                            const isPassing = result.classList.contains('pass');
                            const symbol = isPassing ? '✅' : '❌';
                            text += symbol + ' ' + result.textContent + '\n';
                        });
                    });
                }

            } else {
                // This is single module format
                const sections = resultsDiv.querySelectorAll('.test-section');
                const results = resultsDiv.querySelectorAll('.result');
                const summary = resultsDiv.querySelector('h3:last-of-type');

                if (h3 && h3.textContent.includes('Running')) {
                    // Skip the "Running tests..." message
                }

                let currentSection = '';
                results.forEach(result => {
                    // Check if there's a section header before this result
                    const prevSibling = result.previousElementSibling;
                    if (prevSibling && prevSibling.classList.contains('test-section')) {
                        currentSection = prevSibling.textContent;
                        text += '\n' + currentSection + '\n';
                        text += '-'.repeat(currentSection.length) + '\n';
                    }

                    // Add the test result
                    const isPassing = result.classList.contains('pass');
                    const symbol = isPassing ? '✅' : '❌';
                    text += symbol + ' ' + result.textContent + '\n';
                });

                text += '\n' + '='.repeat(80) + '\n';
                if (summary) {
                    text += summary.textContent + '\n';
                }
            }

            text += '='.repeat(80) + '\n';

            return text;
        }

        // 🚀 Auto-run tests if opened with ?autorun=true
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('autorun') === 'true') {
            console.log('🚀 Autorun mode detected - starting tests automatically');
            // Wait a moment for page to fully load, then trigger run all tests
            setTimeout(() => {
                runAllTestsBtn.click();
            }, 500);
        }
    </script>
    </div> <!-- Close container -->
</body>
