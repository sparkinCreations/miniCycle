    <!-- version.js sets APP_VERSION and, on the bundled build, __MC_MODULE_MAP —
         tests use the map to resolve stable module paths to hashed /build/ URLs
         (source-text greps must read the real bundle, not the 2-line shims). -->
    <script src="../version.js?_cb=1"></script>
    <!-- Environment guard: this standalone origin has NONE of the app's
         version-heal machinery, so its SW/caches can serve a stale module
         environment while the (buster-fetched) test files are current. If the
         controlling SW's version differs from the fresh version.js above, warn
         loudly — results against a mixed environment are meaningless. -->
    <script>
    (function () {
        if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
        var ch = new MessageChannel();
        var timer = setTimeout(function () {}, 0);
        ch.port1.onmessage = function (e) {
            clearTimeout(timer);
            var sw = e.data && e.data.appVersion;
            if (sw && globalThis.APP_VERSION && sw !== globalThis.APP_VERSION) {
                var div = document.createElement('div');
                div.setAttribute('style', 'background:#b91c1c;color:#fff;padding:10px 14px;font:14px monospace;position:sticky;top:0;z-index:9999');
                div.textContent = '⚠️ TEST ENVIRONMENT STALE: service worker v' + sw +
                    ' ≠ deployed v' + globalThis.APP_VERSION +
                    ' — cached modules may be old. Hard-reload (or close/reopen) before trusting results.';
                document.body ? document.body.prepend(div)
                    : document.addEventListener('DOMContentLoaded', function () { document.body.prepend(div); });
            }
        };
        navigator.serviceWorker.controller.postMessage({ type: 'GET_VERSION' }, [ch.port2]);
    })();
    </script>

        // 🚦 TEST MODE FLAG - Tells app to skip IndexedDB restoration after tests
        // Uses same DB as test results for simplicity
        const TEST_MODE_DB = 'miniCycleTestResultsDB';
        const TEST_MODE_STORE = 'results';

        async function setTestModeFlag(active) {
            // 🧪 Set IndexedDB flag - single source of truth for test mode
            // appState.js checks IndexedDB directly (async) to skip saves during tests
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open(TEST_MODE_DB, 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(TEST_MODE_STORE)) {
                            db.createObjectStore(TEST_MODE_STORE, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = () => {
                        const db = request.result;
                        const tx = db.transaction(TEST_MODE_STORE, 'readwrite');
                        const store = tx.objectStore(TEST_MODE_STORE);
                        if (active) {
                            store.put({ id: 'testModeActive', active: true, timestamp: Date.now() });
                        } else {
                            store.delete('testModeActive');
                        }
                        tx.oncomplete = () => {
                            db.close();
                            resolve(true);
                        };
                        tx.onerror = () => {
                            db.close();
                            resolve(false);
                        };
                    };
                    request.onerror = () => resolve(false);
                } catch (e) {
                    console.warn('Could not set test mode flag:', e);
                    resolve(false);
                }
            });
        }

        /**
         * Backup localStorage to IndexedDB before tests run
         * ALWAYS creates a fresh backup of current localStorage state
         * @returns {Promise<{action: string, backupKeys: number}>}
         */
        async function backupLocalStorageToIndexedDB() {
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open(TEST_MODE_DB, 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(TEST_MODE_STORE)) {
                            db.createObjectStore(TEST_MODE_STORE, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = () => {
                        const db = request.result;

                        // ALWAYS capture current localStorage state (fresh backup)
                        const backup = {};
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (key) {
                                backup[key] = localStorage.getItem(key);
                            }
                        }

                        const keyCount = Object.keys(backup).length;
                        console.log(`%c💾 Creating fresh IndexedDB backup: ${keyCount} localStorage keys`, 'background: blue; color: white; padding: 2px 6px;');

                        const writeTx = db.transaction(TEST_MODE_STORE, 'readwrite');
                        const writeStore = writeTx.objectStore(TEST_MODE_STORE);
                        writeStore.put({
                            id: 'preTestBackup',
                            localStorageBackup: backup,
                            timestamp: Date.now()
                        });
                        writeTx.oncomplete = () => {
                            db.close();
                            resolve({ action: 'created-fresh-backup', backupKeys: keyCount });
                        };
                        writeTx.onerror = () => {
                            db.close();
                            resolve({ action: 'error-write-failed', backupKeys: 0 });
                        };
                    };
                    request.onerror = () => {
                        resolve({ action: 'error-db-open-failed', backupKeys: 0 });
                    };
                } catch (e) {
                    resolve({ action: 'error-exception', backupKeys: 0, error: e.message });
                }
            });
        }

        /**
         * Clear the backup from IndexedDB after tests complete successfully
         */
        async function clearLocalStorageBackup() {
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open(TEST_MODE_DB, 1);
                    request.onsuccess = () => {
                        const db = request.result;
                        const tx = db.transaction(TEST_MODE_STORE, 'readwrite');
                        const store = tx.objectStore(TEST_MODE_STORE);
                        store.delete('preTestBackup');
                        tx.oncomplete = () => {
                            db.close();
                            resolve(true);
                        };
                        tx.onerror = () => {
                            db.close();
                            resolve(false);
                        };
                    };
                    request.onerror = () => resolve(false);
                } catch (e) {
                    resolve(false);
                }
            });
        }

        /**
         * Restore localStorage from IndexedDB backup
         * @returns {Promise<{success: boolean, keysRestored: number}>}
         */
        async function restoreLocalStorageFromBackup() {
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open(TEST_MODE_DB, 1);
                    request.onerror = () => resolve({ success: false, keysRestored: 0, error: 'Could not open DB' });
                    request.onsuccess = () => {
                        const db = request.result;
                        const tx = db.transaction(TEST_MODE_STORE, 'readonly');
                        const store = tx.objectStore(TEST_MODE_STORE);
                        const getBackup = store.get('preTestBackup');

                        getBackup.onsuccess = () => {
                            const result = getBackup.result;
                            db.close();

                            if (result && result.localStorageBackup) {
                                const backup = result.localStorageBackup;
                                const keys = Object.keys(backup);

                                console.log(`%c📦 Found IndexedDB backup with ${keys.length} keys`, 'background: blue; color: white; padding: 2px 6px;');

                                // Clear localStorage and restore from backup
                                localStorage.clear();
                                keys.forEach(key => {
                                    localStorage.setItem(key, backup[key]);
                                });

                                resolve({ success: true, keysRestored: keys.length, keys });
                            } else {
                                resolve({ success: false, keysRestored: 0, error: 'No backup found in IndexedDB' });
                            }
                        };
                        getBackup.onerror = () => {
                            db.close();
                            resolve({ success: false, keysRestored: 0, error: 'Query failed' });
                        };
                    };
                } catch (e) {
                    resolve({ success: false, keysRestored: 0, error: e.message });
                }
            });
        }

                    }

                    try {

                        // This ensures consistent window.* exposure for all modules

                    // Create a temporary div for results
                    const tempDiv = document.createElement('div');

                    // Run the tests with a 30-second budget per module — but a budget
                    // measured in VISIBLE time, not wall-clock.
                    //
                    // ⚠️ Background-tab caveat (the cause of false "0/1" timeouts): when
                    // this tab is hidden, the browser PAUSES requestAnimationFrame and
                    // throttles setTimeout to multi-second intervals. Tests that await rAF
                    // (e.g. HeaderLayoutManager) then hang forever, and timer-heavy tests
                    // (e.g. RoutineManager) balloon past any fixed wall-clock timeout — so a
                    // suite run the user tabbed away from reports modules as timed-out even
                    // though they pass with the tab focused. To stop punishing the tests for
                    // the browser pausing them, the budget below only advances while
                    // document.visibilityState === 'visible'; it pauses while hidden (so a
                    // tab-away-then-back run resumes and completes normally). A hard
                    // wall-clock cap is the safety net so an abandoned hidden run can't hang
                    // the whole suite forever, and a run that DID go hidden is labelled as
                    // such instead of as a confusing timeout.
                    const MODULE_TIMEOUT_MS = 30000;          // budget of VISIBLE time
                    const MODULE_WALLCLOCK_CAP_MS = 300000;   // 5 min hard cap (abandoned-hidden-run safety net)
                    let result;

                    // Visible-time accumulator, driven by visibilitychange so paused
                    // (hidden) time never counts toward the budget. In an iframe the Page
                    // Visibility state mirrors the top-level tab, so this tracks the real
                    // browser pause/throttle that breaks the timing-sensitive tests.
                    let visibleAccum = 0;
                    let segStart = document.hidden ? null : performance.now();
                    let wasHiddenDuringRun = document.hidden;
                    const onVisibility = () => {
                        const now = performance.now();
                        if (document.hidden) {
                            wasHiddenDuringRun = true;
                            if (segStart !== null) { visibleAccum += now - segStart; segStart = null; }
                        } else if (segStart === null) {
                            segStart = now;
                        }
                    };
                    document.addEventListener('visibilitychange', onVisibility);
                    const visibleElapsed = () => visibleAccum + (segStart !== null ? performance.now() - segStart : 0);

                    const wallStart = performance.now();
                    const testPromise = module.runFn(tempDiv, true);
                    let settled = false;
                    const timeoutPromise = new Promise((_, reject) => {
                        // Poll (instead of one fixed setTimeout) so the budget can pause
                        // while hidden. The poll timer is itself throttled while hidden —
                        // which is fine, we don't want to count that time anyway.
                        const poll = () => {
                            if (settled) return;
                            if (visibleElapsed() >= MODULE_TIMEOUT_MS ||
                                (performance.now() - wallStart) >= MODULE_WALLCLOCK_CAP_MS) {
                                reject(new Error('TIMEOUT'));
                                return;
                            }
                            setTimeout(poll, 500);
                        };
                        setTimeout(poll, 500);
                    });

                    try {
                        result = await Promise.race([testPromise, timeoutPromise]);
                    } catch (timeoutError) {
                        if (timeoutError.message === 'TIMEOUT') {
                            // Capture how far the module actually got before the timeout fired,
                            // instead of discarding everything as a placeholder "0/1". This shows
                            // whether it hung at load (0 tests rendered) or stalled partway through.
                            const ranPass = tempDiv.querySelectorAll('.result.pass').length;
                            const ranFail = tempDiv.querySelectorAll('.result.fail').length;
                            const ranTotal = ranPass + ranFail;
                            // A run that went hidden almost certainly produced a FALSE timeout
                            // (rAF paused / timers throttled) — surface it as actionable, not a hang.
                            const backgrounded = wasHiddenDuringRun || document.hidden;
                            if (backgrounded) {
                                console.warn(`⏸️ Module "${module.name}" timed out while this tab was BACKGROUNDED (rendered ${ranPass}/${ranTotal}). Re-run with the tab focused — backgrounding pauses requestAnimationFrame and throttles timers; this is not a real failure.`);
                            } else {
                                console.warn(`⏱️ Module "${module.name}" timed out after ${MODULE_TIMEOUT_MS / 1000}s of visible time (rendered ${ranPass}/${ranTotal} tests before timeout)`);
                            }
                            allResults.push({
                                name: module.name,
                                passed: ranPass,
                                // If it produced no results at all, it hung before any test ran —
                                // keep total at least 1 so it still registers as not-all-passed.
                                total: ranTotal > 0 ? ranTotal : 1,
                                timedOut: true,
                                backgrounded,
                                ranNone: ranTotal === 0,
                                html: tempDiv.innerHTML
                                    + `<div class="result fail">${backgrounded ? '⏸️' : '⏱️'} `
                                    + (backgrounded
                                        ? `Timed out while this tab was in the BACKGROUND — re-run with the tab focused. Backgrounding pauses requestAnimationFrame and throttles timers, so timing-sensitive modules stall; this is not a real failure (rendered ${ranPass}/${ranTotal}).`
                                        : `TIMED OUT after ${MODULE_TIMEOUT_MS / 1000}s`
                                          + (ranTotal === 0
                                              ? ` — hung at load, 0 tests ran (passes locally; verify with npm test)`
                                              : ` — rendered ${ranPass}/${ranTotal} before timeout`))
                                    + `</div>`
                            });
                            totalPassed += ranPass;
                            totalTests += (ranTotal > 0 ? ranTotal : 1);
                            continue; // Skip to next module
                        }
                        throw timeoutError; // Re-throw non-timeout errors

                        settled = true;

                        passed: result?.passed || 0,
                        total: result?.total || 0,

                    totalPassed += (result?.passed || 0);
                    totalTests += (result?.total || 0);

                        name: module.name,
                        passed: 0,
                        total: 0,
                        error: error.message,

            // Summary table - check dark mode for colors
            const isDarkMode = document.body.classList.contains('dark-mode');
            const summaryBg = isDarkMode ? '#1e1e2e' : 'rgba(255, 255, 255, 0.95)';
            const summaryText = isDarkMode ? '#e0e0e0' : '#333';
            const headerBorder = isDarkMode ? '#4a4a6a' : '#ddd';
            const rowBorder = isDarkMode ? '#3a3a5a' : '#eee';
            const footerBg = isDarkMode ? '#2a2a4a' : '#e9ecef';
            const passRowBg = isDarkMode ? '#166534' : '#d1fae5';
            const passRowText = isDarkMode ? '#ffffff' : '#000000';
            const failRowBg = isDarkMode ? '#7f1d1d' : '#fee2e2';
            const failRowText = isDarkMode ? '#ffffff' : '#000000';

            // Backgrounded-run banner: timing-sensitive tests can fail or time out
            // spuriously when the tab was hidden (paused rAF, throttled timers). Make that
            // explicit so failures aren't mistaken for real bugs.
            if (suiteWentHidden) {
                const bnBg = isDarkMode ? '#7c4700' : '#fef3c7';
                const bnText = isDarkMode ? '#ffe8b3' : '#92400e';
                const bnBorder = isDarkMode ? '#b45309' : '#f59e0b';
                output += `<div style="background: ${bnBg}; color: ${bnText}; border: 1px solid ${bnBorder}; padding: 12px 16px; border-radius: 8px; margin: 16px 0; font-weight: 600; line-height: 1.4;">⏸️ This tab was in the background during the run. Browsers pause animation frames and throttle timers for hidden tabs, so timing-sensitive tests can fail or time out spuriously. Re-run with this tab kept in the foreground before treating any failure as a real bug.</div>`;
            }

            output += `<div style="background: ${summaryBg}; padding: 20px; border-radius: 8px; margin: 20px 0; color: ${summaryText};">`;
            output += `<h3 style="color: ${summaryText}; margin-top: 0;">📊 Summary</h3>`;
            output += '<table style="width: 100%; border-collapse: collapse;">';
            output += `<thead><tr style="border-bottom: 2px solid ${headerBorder};"><th style="text-align: left; padding: 8px;">Module</th><th style="text-align: right; padding: 8px;">Passed</th><th style="text-align: right; padding: 8px;">Total</th><th style="text-align: right; padding: 8px;">Status</th></tr></thead>`;
            output += '<tbody>';

            for (const result of allResults) {
                const passRate = result.total > 0 ? (result.passed / result.total * 100).toFixed(0) : 0;
                let statusEmoji, rowBg, rowText, statusText;

                if (result.skipped) {
                    statusEmoji = '⏭️';
                    statusText = 'SKIPPED';
                    rowBg = isDarkMode ? '#3a3a5a' : '#f0f0f0';
                    rowText = isDarkMode ? '#aaaaaa' : '#888888';
                } else if (result.backgrounded) {
                    statusEmoji = '⏸️';
                    statusText = 'BACKGROUNDED';
                    rowBg = isDarkMode ? '#312e81' : '#e0e7ff'; // Indigo — distinct from a real timeout
                    rowText = isDarkMode ? '#c7d2fe' : '#3730a3';
                } else if (result.timedOut) {
                    statusEmoji = '⏱️';
                    statusText = 'TIMEOUT';
                    rowBg = isDarkMode ? '#7c4700' : '#fef3c7'; // Orange/yellow for timeout
                    rowText = isDarkMode ? '#ffffff' : '#92400e';
                } else if (result.passed === result.total) {
                    statusEmoji = '✅';
                    statusText = `${passRate}%`;
                    rowBg = passRowBg;
                    rowText = passRowText;
                } else {
                    statusEmoji = '❌';
                    statusText = `${passRate}%`;
                    rowBg = failRowBg;
                    rowText = failRowText;
                }

                output += `<tr style="border-bottom: 1px solid ${rowBorder}; background: ${rowBg}; color: ${rowText};">`;
                output += `<td style="padding: 8px; font-weight: 600;">${result.name}</td>`;
                output += `<td style="text-align: right; padding: 8px;">${result.passed}</td>`;
                output += `<td style="text-align: right; padding: 8px;">${result.total}</td>`;
                output += `<td style="text-align: right; padding: 8px;">${statusEmoji} ${statusText}</td>`;
                output += '</tr>';
            }

            output += '</tbody>';
            output += `<tfoot><tr style="border-top: 2px solid ${summaryText}; font-weight: bold; background: ${footerBg}; color: ${summaryText};"><td style="padding: 8px;">TOTAL</td><td style="text-align: right; padding: 8px;">${totalPassed}</td><td style="text-align: right; padding: 8px;">${totalTests}</td><td style="text-align: right; padding: 8px;">${totalPassed === totalTests ? '✅' : '❌'} ${totalTests > 0 ? (totalPassed / totalTests * 100).toFixed(0) : 0}%</td></tr></tfoot>`;
            output += '</table>';
            output += '</div>';

            // Detailed results for each module
            output += '<h3 style="margin-top: 30px;">📋 Detailed Results</h3>';
            for (const result of allResults) {
                if (result.skipped) {
                    output += '<div style="margin: 20px 0; padding: 15px; background: rgba(128, 128, 128, 0.1); border-radius: 8px; opacity: 0.7;">';
                    output += `<h4 style="margin-top: 0;">⏭️ ${result.name} (SKIPPED)</h4>`;
                    output += `<p style="margin: 0; font-style: italic;">${result.skipReason}</p>`;
                    output += '</div>';
                    continue;
                }
                output += '<div style="margin: 20px 0; padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 8px;">';
                output += `<h4 style="margin-top: 0;">${result.name} (${result.passed}/${result.total})</h4>`;
                output += result.html;
                output += '</div>';
            }

                resultsDiv.innerHTML = output;
                copyResultsBtn.style.display = 'inline-block';
                copyFailedBtn.style.display = 'inline-block';

                // 📤 Send results back to opener if this was an autorun request
                if (new URLSearchParams(window.location.search).get('autorun') === 'true') {
                    const failedModules = allResults.filter(r => r.passed !== r.total);
                    // A module that TIMED OUT is INCOMPLETE even when every rendered test
                    // passed — later tests may simply never have run (this is how a hung
                    // module could masquerade as a clean "N/N" pass). Surface these
                    // separately so they can't be mistaken for a real pass.
                    const incompleteModules = allResults.filter(r => r.timedOut);
                    const resultData = {
                        type: 'TEST_RESULTS',
                        totalPassed,
                        totalTests,
                        duration,
                        // Not a clean pass if anything timed out, even if passed===total for
                        // the rendered subset.
                        allPassed: totalPassed === totalTests && incompleteModules.length === 0,
                        failedModules: failedModules.map(m => ({
                            name: m.name,
                            passed: m.passed,
                            total: m.total,
                            error: m.error,
                            timedOut: m.timedOut,
                            backgrounded: m.backgrounded
                        })),
                        // Timed-out modules (may have skipped tests), surfaced even if their
                        // rendered tests all passed.
                        incompleteModules: incompleteModules.map(m => ({
                            name: m.name, passed: m.passed, total: m.total, backgrounded: m.backgrounded
                        })),
                        // True if ANY module timed out while the tab was hidden — the parent
                        // shows a "re-run focused" hint instead of treating these as real bugs.
                        anyBackgrounded: failedModules.some(m => m.backgrounded),
                        // True if the tab was hidden at ANY point during the run — covers
                        // spurious ASSERTION failures too (not just timeouts), since
                        // throttled timers/paused rAF break timing-sensitive tests.
                        suiteWentHidden,
                        timestamp: Date.now()
                    };

                    // Results flow purely via postMessage. The parent app is on a different
                    // origin and cannot read this origin's IndexedDB, so there is nothing to
                    // store — and a stray IndexedDB transaction here could throw and hang the
                    // completion before TEST_RESULTS is ever posted.
                    const isEmbedded = new URLSearchParams(window.location.search).get('embedded') === 'true';
                    if (isEmbedded && window.parent !== window) {
                        // Embedded in iframe - send to parent
                        window.parent.postMessage(resultData, PARENT_ORIGIN);
                        console.log('📤 Sent test results to parent (embedded mode)');
                    } else if (window.opener) {
                        // Popup window - send to opener
                        window.opener.postMessage(resultData, PARENT_ORIGIN);
                        window.opener.focus();
                        console.log('📤 Sent test results to opener');
                    }
                }

            } catch (error) {
                console.error('❌ Fatal error during test execution:', error);
                resultsDiv.innerHTML += `<div class="result fail">❌ Fatal error: ${error.message}</div>`;
            } finally {
                // Hermetic runner on an isolated origin — no real user data to
                // restore, so no cleanup is required here.
            }
        });

        // Convert only failed tests to plain text format
        function convertFailedTestsToText() {
            const h2 = resultsDiv.querySelector('h2');
            let text = '';

            // Check if this is "Run All Tests" results (has a table)
            const summaryTable = resultsDiv.querySelector('table');

            if (summaryTable) {
                // Count total failures first
                const allFailedResults = resultsDiv.querySelectorAll('.result.fail');
                if (allFailedResults.length === 0) {
                    return '';
                }

                text += '='.repeat(80) + '\n';
                text += '❌ FAILED TESTS (' + allFailedResults.length + ' failures)\n';
                text += '='.repeat(80) + '\n\n';

                // Group failures by module
                const moduleBlocks = resultsDiv.querySelectorAll('div[style*="margin: 20px 0"]');
                moduleBlocks.forEach(block => {
                    const h4 = block.querySelector('h4');
                    const failedResults = block.querySelectorAll('.result.fail');

                    if (failedResults.length > 0 && h4) {
                        text += '\n' + h4.textContent + ' (' + failedResults.length + ' failed)\n';
                        text += '-'.repeat(h4.textContent.length + 10) + '\n';

                        failedResults.forEach(result => {
                            text += '❌ ' + result.textContent + '\n';
                        });
                    }
                });

            } else {
                // Single module format
                const failedResults = resultsDiv.querySelectorAll('.result.fail');
                if (failedResults.length === 0) {
                    return '';
                }

                text += '='.repeat(80) + '\n';
                text += '❌ FAILED TESTS (' + failedResults.length + ' failures)\n';
                if (h2) {
                    text += 'Module: ' + h2.textContent + '\n';
                }
                text += '='.repeat(80) + '\n\n';

                let currentSection = '';
                failedResults.forEach(result => {
                    // Check for section header
                    let prevSibling = result.previousElementSibling;
                    while (prevSibling) {
                        if (prevSibling.classList && prevSibling.classList.contains('test-section')) {
                            if (currentSection !== prevSibling.textContent) {
                                currentSection = prevSibling.textContent;
                                text += '\n' + currentSection + '\n';
                                text += '-'.repeat(currentSection.length) + '\n';
                            }
                            break;
                        }
                        prevSibling = prevSibling.previousElementSibling;
                    }

                    text += '❌ ' + result.textContent + '\n';
                });
            }

            text += '\n' + '='.repeat(80) + '\n';
            return text;
        }

        // Convert HTML results to plain text format
        function convertResultsToText() {
            const h2 = resultsDiv.querySelector('h2');
            const h3 = resultsDiv.querySelector('h3');

            let text = '='.repeat(80) + '\n';
            text += h2 ? h2.textContent + '\n' : 'Test Results\n';
            text += '='.repeat(80) + '\n\n';

            // Check if this is "Run All Tests" results (has a table)
            const summaryTable = resultsDiv.querySelector('table');

            if (summaryTable) {
                // This is "Run All Tests" format
                if (h3) {
                    text += h3.textContent + '\n\n';
                }

                // Extract table data
                text += '📊 SUMMARY\n';
                text += '-'.repeat(80) + '\n';
                text += String('Module').padEnd(25) + String('Passed').padStart(10) + String('Total').padStart(10) + String('Status').padStart(15) + '\n';
                text += '-'.repeat(80) + '\n';

                const rows = summaryTable.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    if (cells.length >= 4) {
                        const module = cells[0].textContent.padEnd(25);
                        const passed = cells[1].textContent.padStart(10);
                        const total = cells[2].textContent.padStart(10);
                        const status = cells[3].textContent.padStart(15);
                        text += module + passed + total + status + '\n';
                    }
                });

                // Add footer total
                const footer = summaryTable.querySelector('tfoot tr');
                if (footer) {
                    const cells = footer.querySelectorAll('td');
                    if (cells.length >= 4) {
                        text += '-'.repeat(80) + '\n';
                        const module = cells[0].textContent.padEnd(25);
                        const passed = cells[1].textContent.padStart(10);
                        const total = cells[2].textContent.padStart(10);
                        const status = cells[3].textContent.padStart(15);
                        text += module + passed + total + status + '\n';
                    }
                }
                text += '='.repeat(80) + '\n\n';

                // Add detailed results
                const detailedHeading = Array.from(resultsDiv.querySelectorAll('h3')).find(h => h.textContent.includes('Detailed Results'));
                if (detailedHeading) {
                    text += detailedHeading.textContent + '\n';
                    text += '='.repeat(80) + '\n\n';

                    const moduleBlocks = resultsDiv.querySelectorAll('div[style*="margin: 20px 0"]');
                    moduleBlocks.forEach(block => {
                        const h4 = block.querySelector('h4');
                        if (h4) {
                            text += '\n' + h4.textContent + '\n';
                            text += '-'.repeat(h4.textContent.length) + '\n';
                        }

                        const results = block.querySelectorAll('.result');
                        results.forEach(result => {
                            const isPassing = result.classList.contains('pass');
                            const symbol = isPassing ? '✅' : '❌';
                            text += symbol + ' ' + result.textContent + '\n';
                        });
                    });
                }

            } else {
                // This is single module format
                const sections = resultsDiv.querySelectorAll('.test-section');
                const results = resultsDiv.querySelectorAll('.result');
                const summary = resultsDiv.querySelector('h3:last-of-type');

                if (h3 && h3.textContent.includes('Running')) {
                    // Skip the "Running tests..." message
                }

                let currentSection = '';
                results.forEach(result => {
                    // Check if there's a section header before this result
                    const prevSibling = result.previousElementSibling;
                    if (prevSibling && prevSibling.classList.contains('test-section')) {
                        currentSection = prevSibling.textContent;
                        text += '\n' + currentSection + '\n';
                        text += '-'.repeat(currentSection.length) + '\n';
                    }

                    // Add the test result
                    const isPassing = result.classList.contains('pass');
                    const symbol = isPassing ? '✅' : '❌';
                    text += symbol + ' ' + result.textContent + '\n';
                });

                text += '\n' + '='.repeat(80) + '\n';
                if (summary) {
                    text += summary.textContent + '\n';
                }
            }

            text += '='.repeat(80) + '\n';

            return text;
        }

        // 🚀 Auto-run tests if opened with ?autorun=true
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('autorun') === 'true') {
            console.log('🚀 Autorun mode detected - starting tests automatically');
            // Wait a moment for page to fully load, then trigger run all tests
            setTimeout(() => {
                runAllTestsBtn.click();
            }, 500);
        }
    </script>
    </div> <!-- Close container -->
</body>
</html>
